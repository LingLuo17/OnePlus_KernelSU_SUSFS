name: GetManager

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      ksu_variant:
        required: true
        type: string
      build_channel:
        description: "构建管理器通道：正式 (Release) 对齐官方发行版；最新 (HEAD) 跟随上游最新提交（FinaSU 取 build-manager.yml 最新构建）"
        required: false
        type: string
        default: "正式 (Release)"
      use_nomount:
        description: "下载 NoMount 挂载元模块（需配合内核侧 CONFIG_NOMOUNT 构建，用户需自行刷入）"
        required: false
        type: boolean
        default: false
      use_rekernel:
        description: "构建总结展示：是否启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      enable_droidspaces_ntsync:
        description: "构建总结展示：是否启用 Droidspaces 容器与 NTSync"
        required: false
        type: boolean
        default: false
      optimize_level:
        description: "构建总结展示：编译器优化级别"
        required: false
        type: string
        default: "O2"
      mlgo:
        description: "构建总结展示：是否启用 MLGO"
        required: false
        type: boolean
        default: true
      mirror_toolchains:
        description: "构建总结展示：是否同步工具链缓存"
        required: false
        type: boolean
        default: true
      custom_version:
        description: "构建总结展示：自定义内核版本名"
        required: false
        type: string
        default: ""
      build_timestamp:
        description: "构建总结展示：自定义构建时间"
        required: false
        type: string
        default: ""
    outputs:
      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}
      managerVer:
        description: "官方 Manager 构建的实测版本号"
        value: ${{ jobs.get_ksu_manager.outputs.managerVer }}
      ksuCommit:
        description: "内核侧对齐用的提交 SHA（正式=Release 标签/官方构建提交；最新=SukiSU-Nova 默认分支 HEAD，BakaSU/FinaSU 最新构建提交）"
        value: ${{ jobs.get_ksu_manager.outputs.ksuCommit }}
      ksuBranch:
        description: "内核侧对齐提交所在的分支或 Release 标签（发布说明展示用）"
        value: ${{ jobs.get_ksu_manager.outputs.ksuBranch }}
      channelTag:
        description: "正式通道选用的 Release 标签（无正式版或最新通道时为空）"
        value: ${{ jobs.get_ksu_manager.outputs.channelTag }}
      managerCertSize:
        description: "FinaSU 管理器签名证书 DER 尺寸（0x 十六进制，内核第二信任槽对齐用）"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertSize }}
      managerCertHash:
        description: "FinaSU 管理器签名证书 SHA256（内核第二信任槽对齐用）"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertHash }}
jobs:
  get_ksu_manager:
    runs-on: ubuntu-24.04
    continue-on-error: true
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
      # 输出3: Manager 实测版本号
      managerVer: ${{ steps.add_KSU.outputs.managerVer }}
      # 输出4: 内核侧对齐用的提交 SHA
      ksuCommit: ${{ steps.add_KSU.outputs.ksuCommit }}
      # 输出4b: 内核侧对齐提交所在分支/标签
      ksuBranch: ${{ steps.add_KSU.outputs.ksuBranch }}
      # 输出5: 正式通道选用的 Release 标签
      channelTag: ${{ steps.add_KSU.outputs.channelTag }}
      # 输出6/7: FinaSU 管理器签名证书（内核第二信任槽对齐用）
      managerCertSize: ${{ steps.add_KSU.outputs.managerCertSize }}
      managerCertHash: ${{ steps.add_KSU.outputs.managerCertHash }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出脚本仓库
        uses: actions/checkout@v6

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |
          if [ "${{ inputs.ksu_variant }}" == "SukiSU-Nova" ]; then
            echo "This is the SukiSU-Nova variant"
            git clone https://git.zako.shirkneko.top:20004/shirkneko/SukiSU.git KernelSU
          elif [ "${{ inputs.ksu_variant }}" == "BakaSU" ]; then
            echo "This is the BakaSU variant"
            git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          elif [ "${{ inputs.ksu_variant }}" == "FinaSU" ]; then
            echo "This is the FinaSU variant"
            git clone https://github.com/LyraVoid/FinaSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU

          # 计算KSU版本号
          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.ksu_variant }}" == "SukiSU-Nova" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION + 996))
          elif [ "${{ inputs.ksu_variant }}" == "FinaSU" ]; then
            # FinaSU 内核 Kbuild 与管理器 build.gradle.kts 均以 30000 + git 提交数计算版本
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          else
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 计算SUSFS版本号
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop"
          SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          echo $SUS_VERSION

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

          echo "KSU_VERSION (for manager consistency check): $KSU_VERSION / SUSFS module: $SUS_VERSION"

      # ==================== 构建通道 ====================
      # 正式：管理器取官方「正式版」Release（prerelease=false，标签提交 + 该 Release 的 APK）；
      #       上游没有正式版 Release 时（如 BakaSU 只有 rc 预发布），
      #       改用官方默认分支最新上传构建，内核仍锁定该构建提交
      # 最新：SukiSU-Nova 取 zako 滚动 Release（manager-ci 等预发布）的管理器 APK，内核锁定 main HEAD；
      #       BakaSU 锁定默认分支 HEAD，管理器取与 HEAD 版本一致的最新构建（不限分支）；
      #       FinaSU 取 build-manager.yml 最新成功构建，内核锁定该构建提交
      - name: 选择管理器来源（构建通道）
        id: channel
        run: |
          CHANNEL_RAW="${{ inputs.build_channel }}"
          case "$CHANNEL_RAW" in
            最新*|latest*|HEAD*) CHANNEL_KIND="latest"; PIN_MODE="head" ;;
            *)                   CHANNEL_KIND="release"; PIN_MODE="pin" ;;
          esac
          echo "构建通道: $CHANNEL_RAW -> $CHANNEL_KIND (pin_mode=$PIN_MODE)"

          case "${{ inputs.ksu_variant }}" in
            "SukiSU-Nova") REPO="shirkneko/SukiSU";     PREF="universal" ;;
            "BakaSU") REPO="Baka-SU/BakaSU";           PREF="arm64" ;;
            "FinaSU") REPO="LyraVoid/FinaSU";          PREF="universal" ;;
            *) echo "::error::未知变体"; exit 1 ;;
          esac

          {
            echo "CHANNEL_KIND=$CHANNEL_KIND"
            echo "PIN_MODE=$PIN_MODE"
            echo "MANAGER_SOURCE=ci"
          } >> "$GITHUB_ENV"

          if [ "${{ inputs.ksu_variant }}" == "SukiSU-Nova" ]; then
            # SukiSU-Nova 管理器已迁至 CNB 结果仓库（cnb.cool/shirkneko/sukisu-result）。
            # web JSON 接口使用专用 Accept 头，可匿名分页读取 Release。
            # 正式通道取最新正式版（is_prerelease=false），最新通道取滚动 manager-ci。
            CNB_WEB="https://cnb.cool/shirkneko/sukisu-result/-/releases"
            REPO_URL="https://git.zako.shirkneko.top:20004/shirkneko/SukiSU.git"
            if [ "$CHANNEL_KIND" = "latest" ]; then
              CNB_PICK_CI=1
              echo "最新通道：SukiSU-Nova 取 CNB 滚动 Release（manager-ci）"
            else
              CNB_PICK_CI=0
              echo "正式通道：SukiSU-Nova 取 CNB 最新正式 Release（is_prerelease=false）"
            fi
            # 自动翻页，避免频繁 CI Release 将正式版或 manager-ci 挤出首页。
            # here-doc 的 Python 顶层代码与 run 块保持同级，确保 YAML 解析后缩进合法。
            CNB_PICK=$(python3 - "$CNB_PICK_CI" "$CNB_WEB" <<'PY'
          import json, sys, time
          from urllib.request import Request, urlopen

          want_ci = sys.argv[1] == "1"
          base_url = sys.argv[2]
          chosen = None
          page = 1
          fetched = 0
          while chosen is None:
            url = f"{base_url}?page={page}&page_size=100"
            for attempt in range(3):
              try:
                request = Request(url, headers={
                  "Accept": "application/vnd.cnb.web+json",
                  "User-Agent": "OnePlus-KernelSU-SUSFS-Manager-Check",
                })
                with urlopen(request, timeout=60) as response:
                  payload = json.load(response)
                break
              except Exception as exc:
                if attempt == 2:
                  raise
                print(f"获取 CNB Release 列表失败，重试 ({attempt + 1}/3): {exc}", file=sys.stderr)
                time.sleep(5)
            releases = payload.get("releases") or []
            if not releases:
              break
            fetched += len(releases)
            if want_ci:
              chosen = next((r for r in releases
                             if r.get("tag_ref", "").endswith("/manager-ci")
                             and any(a.get("name", "").endswith(".apk") for a in r.get("assets", []))), None)
            else:
              chosen = next((r for r in releases
                             if not r.get("is_prerelease") and not r.get("is_draft")
                             and any(a.get("name", "").endswith(".apk") for a in r.get("assets", []))), None)
            total = int(payload.get("release_count") or 0)
            if (total and fetched >= total) or (not total and len(releases) < 100):
              break
            page += 1
          if chosen is None:
            sys.exit(1)
          apks = [a for a in chosen.get("assets", []) if a.get("name", "").endswith(".apk")]
          apks.sort(key=lambda a: (
            0 if "arm64" in a.get("name", "") else
            1 if "universal" in a.get("name", "") else 2))
          apk = apks[0]
          tag = chosen.get("tag_ref", "").removeprefix("refs/tags/")
          print(tag, apk.get("name", ""), "https://cnb.cool" + apk.get("path", ""), sep="\t")
          PY
            ) || true
            if [ -z "$CNB_PICK" ]; then
              echo "::error::CNB Release 负载中没有可用的 SukiSU-Nova 管理器（通道 $CHANNEL_KIND）"
              exit 1
            fi
            PICK="$CNB_PICK"
            echo "Release 候选：$(printf '%s' "$PICK" | cut -f1)（CNB），管理器 $(printf '%s' "$PICK" | cut -f2)"
          else
            if [ "$CHANNEL_KIND" != "release" ]; then
              echo "最新通道：BakaSU 锁定默认分支 HEAD；FinaSU 取 build-manager.yml 最新构建"
              exit 0
            fi

            API_BASE="https://api.github.com/repos/$REPO"
            REPO_URL="https://github.com/$REPO.git"
            ALLOW_ROLLING=0
            ALLOW_PRE=0

            # ---------- 正式通道：解析官方 Release ----------
            # 仓库改名迁移后 /releases 列表端点可能稳定返回空数组（[]），
            # 而 /releases/latest 与 /releases/tags/<tag> 仍正常。所以先取 latest，
            # 再与列表合并去重，避免正式版被误判成“没有可用 Release”而回退到旧 CI 产物。
            LATEST_JSON=""
            for ATTEMPT in 1 2 3; do
              LATEST_JSON=$(curl -s --fail --max-time 30 \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/releases/latest") \
                && [ -n "$LATEST_JSON" ] && [ "$LATEST_JSON" != "null" ] && break
              echo "获取 $REPO 最新 Release 失败，重试 ($ATTEMPT/3)..."
              LATEST_JSON=""
              sleep 5
            done

            LIST_JSON=""
            for ATTEMPT in 1 2 3; do
              LIST_JSON=$(curl -s --fail --max-time 30 \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/releases?per_page=40") \
                && [ -n "$LIST_JSON" ] && break
              echo "获取 $REPO 的 Release 列表失败，重试 ($ATTEMPT/3)..."
              LIST_JSON=""
              sleep 5
            done

            REL_JSON=""
            if [ -n "$LATEST_JSON" ] && [ -n "$LIST_JSON" ]; then
              REL_JSON=$(printf '%s\n%s' "$(printf '%s' "$LATEST_JSON" | jq -c '[.]')" "$LIST_JSON" \
                | jq -s -c 'add | unique_by(.id)')
            elif [ -n "$LATEST_JSON" ]; then
              REL_JSON=$(printf '%s' "$LATEST_JSON" | jq -c '[.]')
            elif [ -n "$LIST_JSON" ]; then
              REL_JSON="$LIST_JSON"
            fi
            echo "Release 候选数: $(printf '%s' "${REL_JSON:-[]}" | jq 'length')（latest=${LATEST_JSON:+yes} list=${LIST_JSON:+yes}）"
          fi

          # 选择规则（GitHub 变体：BakaSU / FinaSU 正式通道）：
          #   1) 跳过草稿与滚动发布标签（manager-ci / nightly / latest 等）
          #   2) 只保留带 APK 资产的 Release（排除 debug / spoofed 包）
          #   3) 正式通道只接受正式版（prerelease=false）：rc / beta 等预发布属于"最新"范畴
          #   4) ABI 偏好：BakaSU 取 arm64-v8a，其余优先 universal
          # （SukiSU-Nova 已在上面从 CNB 解析出 PICK 三件套，跳过本段）
          if [ "${{ inputs.ksu_variant }}" != "SukiSU-Nova" ] && [ -n "$REL_JSON" ]; then
            PICK=$(printf '%s' "$REL_JSON" | jq -r --arg pref "$PREF" \
              --argjson allow_rolling "$ALLOW_ROLLING" --argjson allow_pre "$ALLOW_PRE" '
              [ .[] | select(.draft == false) ]
              | map(. + { _ts: (.published_at // .created_at // "") })
              | sort_by(._ts) | reverse
              | map(. + {
                  _rolling: (.tag_name | test("(?i)^(manager-ci|manager_ci|nightly|latest|ci)$")),
                  _apks: [ .assets[]?
                           | select(.name | test("\\.apk$"; "i"))
                           | select(.name | test("(?i)debug|spoofed") | not) ]
                })
              | map(. + {
                  _apks: (._apks | sort_by(
                    if   (.name | test("(?i)" + $pref)) then 0
                    elif (.name | test("(?i)universal")) then 1
                    elif (.name | test("(?i)arm64")) then 2
                    else 3 end))
                })
              | map(select((($allow_rolling == 1) or (._rolling | not)) and ((._apks | length) > 0)))
              | map(select(($allow_pre == 1) or (.prerelease | not)))
              | .[0] as $p
              | if $p then
                  [ $p.tag_name, $p._apks[0].name, $p._apks[0].browser_download_url ] | @tsv
                else empty end
            ')
          fi

          if [ -z "$PICK" ]; then
            if [ "${{ inputs.ksu_variant }}" == "SukiSU-Nova" ]; then
              echo "::error::SukiSU-Nova 没有可用 Release（通道 $CHANNEL_KIND）"
              exit 1
            fi
            echo "::notice::$REPO 没有可用的正式版 Release（仅预发布或未附 APK），改用官方默认分支最新上传构建（内核仍锁定该提交）"
            exit 0
          fi

          IFS=$'\t' read -r REL_TAG REL_APK_NAME REL_APK_URL <<< "$PICK"

          # SukiSU-Nova 最新通道：管理器来自滚动 Release（manager-ci），其标签
          # 停留在旧提交上，而 APK 的 versionCode 是按 main 分支提交数计算的，
          # 因此内核侧对齐当前 main HEAD，避免内核版本落后于管理器。
          if [ "${{ inputs.ksu_variant }}" == "SukiSU-Nova" ] && [ "$CHANNEL_KIND" = "latest" ]; then
            REL_COMMIT=$(git -C KernelSU rev-parse "origin/main^{commit}" 2>/dev/null || git -C KernelSU rev-parse "HEAD^{commit}" 2>/dev/null || true)
            if [ -z "$REL_COMMIT" ]; then
              echo "::error::无法解析 zako SukiSU 的 main HEAD，不能对齐内核版本"
              exit 1
            fi
            echo "最新通道：SukiSU-Nova 内核对齐 main HEAD ${REL_COMMIT:0:8}，管理器 $REL_APK_NAME"
          else
            # 解析 Release 标签对应的提交（优先本地克隆，回退远端查询）
            REL_COMMIT=$(git -C KernelSU rev-parse "${REL_TAG}^{commit}" 2>/dev/null || true)
            if [ -z "$REL_COMMIT" ]; then
              # annotated tag 需解引用，否则拿到的是标签对象而非提交
              REL_COMMIT=$(git ls-remote "$REPO_URL" "refs/tags/${REL_TAG}^{}" 2>/dev/null | awk '{print $1}')
            fi
            if [ -z "$REL_COMMIT" ]; then
              REL_COMMIT=$(git ls-remote "$REPO_URL" "refs/tags/${REL_TAG}" 2>/dev/null | awk '{print $1}')
            fi
            if [ -z "$REL_COMMIT" ]; then
              echo "::warning title=正式通道回退::无法解析 Release $REL_TAG 对应的提交，改用官方默认分支最新上传构建"
              exit 0
            fi
          fi

          {
            echo "MANAGER_SOURCE=release"
            echo "REL_TAG=$REL_TAG"
            echo "REL_COMMIT=$REL_COMMIT"
            echo "REL_APK_NAME=$REL_APK_NAME"
            echo "REL_APK_URL=$REL_APK_URL"
          } >> "$GITHUB_ENV"

          if [ "$CHANNEL_KIND" = "release" ]; then
            echo "正式通道：Release $REL_TAG (${REL_COMMIT:0:8})，管理器 $REL_APK_NAME"
          else
            echo "最新通道：Release $REL_TAG (${REL_COMMIT:0:8})，管理器 $REL_APK_NAME，内核对齐 main HEAD"
          fi

      # Manager resolution lives in scripts/get-manager.sh so the reusable
      # workflow stays below GitHub's per-step expression length limit.
      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        env:
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          BUILD_CHANNEL: ${{ inputs.build_channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/scripts/get-manager.sh"

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        run: |
          # 模块通过 sidex15/susfs4ksu-module 的 GitHub Releases 发布，拉取最新 Release 资产
          RELEASE_API="https://api.github.com/repos/sidex15/susfs4ksu-module/releases/latest"
          RELEASE_JSON=""
          for ATTEMPT in 1 2 3; do
            RELEASE_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_API") \
              && [ -n "$RELEASE_JSON" ] && break
            echo "获取 Release 信息失败，重试 ($ATTEMPT/3)..."
            sleep 5
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "无法获取 susfs4ksu-module 最新 Release 信息"
            exit 1
          fi

          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select((.name | contains("ksu_module_susfs")) and (.name | endswith(".zip"))) | .browser_download_url' | head -n 1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Release $TAG_NAME 中未找到 ksu_module_susfs 模块 zip"
            exit 1
          fi

          NAME="ksu_module_susfs.zip"
          echo "下载 SUSFS 模块: $NAME (Release $TAG_NAME)"
          if ! curl -sL --fail --retry 3 --max-time 120 -o "$NAME" "$ASSET_URL"; then
            echo "下载 SUSFS 模块失败: $ASSET_URL"
            exit 1
          fi
          echo "SUSFS_NAME=$TAG_NAME" >> $GITHUB_ENV

          # Release 资产本身即完整模块 zip，校验完整性后直接放入模块目录
          if ! unzip -t "$NAME" >/dev/null 2>&1; then
            echo "下载的 SUSFS 模块 zip 损坏"
            exit 1
          fi
          mkdir -p susfs-module
          mv "$NAME" "susfs-module/$NAME"
          ls -la susfs-module/

      - name: 添加 NoMount 模块
        id: add_nomount
        if: inputs.use_nomount
        continue-on-error: true
        run: |
          # NoMount 元模块通过 maxsteeel/nomount 的 GitHub Releases 发布，拉取最新 Release 资产
          RELEASE_API="https://api.github.com/repos/maxsteeel/nomount/releases/latest"
          RELEASE_JSON=""
          for ATTEMPT in 1 2 3; do
            RELEASE_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_API") \
              && [ -n "$RELEASE_JSON" ] && break
            echo "获取 NoMount Release 信息失败，重试 ($ATTEMPT/3)..."
            sleep 5
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "无法获取 nomount 最新 Release 信息"
            exit 1
          fi

          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n 1)
          ASSET_NAME=$(basename "$ASSET_URL")

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Release $TAG_NAME 中未找到 NoMount 模块 zip"
            exit 1
          fi

          echo "下载 NoMount 模块: $ASSET_NAME (Release $TAG_NAME)"
          if ! curl -sL --fail --retry 3 --max-time 180 -o "$ASSET_NAME" "$ASSET_URL"; then
            echo "下载 NoMount 模块失败: $ASSET_URL"
            exit 1
          fi
          echo "NOMOUNT_NAME=$TAG_NAME" >> "$GITHUB_ENV"

          # 校验完整性后解压为模块目录，发布时重新打包为可直接刷入的 zip
          if ! unzip -t "$ASSET_NAME" >/dev/null 2>&1; then
            echo "下载的 NoMount 模块 zip 损坏"
            exit 1
          fi
          rm -rf nomount-module
          mkdir -p nomount-module
          unzip -oq "$ASSET_NAME" -d nomount-module
          rm -f "$ASSET_NAME"
          [ -f nomount-module/module.prop ] || { echo "NoMount 模块缺少 module.prop"; exit 1; }
          ls -la nomount-module/

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "下载CI构建的KSU失败!"

      - name: 构建总结
        if: always()
        run: |
          VARIANT="${{ inputs.ksu_variant }}"
          MANAGER_VER="${{ steps.add_KSU.outputs.managerVer }}"
          [ -n "$MANAGER_VER" ] || MANAGER_VER="未获取"

          # SukiSU-Nova 跳过「选择管理器来源」步骤，CHANNEL_KIND 可能从未写入 env；
          # 与 add_KSU 的兜底一致，直接按输入判断通道
          CHANNEL_KIND="${CHANNEL_KIND:-}"
          if [ -z "$CHANNEL_KIND" ]; then
            case "${{ inputs.build_channel }}" in
              最新*|latest*|HEAD*) CHANNEL_KIND="latest" ;;
              *)                   CHANNEL_KIND="release" ;;
            esac
          fi

          case "$CHANNEL_KIND" in
            latest) CH_LABEL="最新通道（HEAD）" ;;
            *)      CH_LABEL="正式通道（Release）" ;;
          esac

          flag() { [ "$1" = "true" ] && echo "✅ 启用" || echo "➖ 关闭"; }

          VER_ROW="${{ inputs.custom_version }}"
          [ -n "$VER_ROW" ] || VER_ROW="默认"
          TIME_ROW="${{ inputs.build_timestamp }}"
          [ -n "$TIME_ROW" ] || TIME_ROW="自动（当前北京时间）"

          {
            echo "## 📊 构建总结"
            echo ""
            echo "**$VARIANT** · 管理器 \`$MANAGER_VER\` · $CH_LABEL"
            echo ""
            echo "### ⚙️ 构建选项"
            echo ""
            echo "| 功能 | 选择 |"
            echo "|:---|:---|"
            echo "| SUSFS | ✅ 启用 |"
            echo "| Droidspaces 容器 & NTSync | $(flag "${{ inputs.enable_droidspaces_ntsync }}") |"
            echo "| BBG 基带保护 | ✅ 启用 |"
            echo "| 网络增强 | ✅ 启用 |"
            echo "| Re-Kernel 驱动 | $(flag "${{ inputs.use_rekernel }}") |"
            echo "| NoMount 元模块 | $(flag "${{ inputs.use_nomount }}") |"
            echo "| 优化级别 | \`${{ inputs.optimize_level }}\` |"
            echo "| MLGO | $(flag "${{ inputs.mlgo }}") |"
            echo "| 工具链同步 | $(flag "${{ inputs.mirror_toolchains }}") |"
            echo "| 自定义内核版本名 | ${VER_ROW} |"
            echo "| 自定义构建时间 | ${TIME_ROW} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传APK
        if: env.MANAGER_FETCH_OK == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ksu_variant }}-Manager(${{ env.MANAGER_VERSION }})
          path: |
            manager-artifacts/**/*.apk
          if-no-files-found: error

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*

      - name: 上传NoMount模块
        if: inputs.use_nomount && steps.add_nomount.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: nomount-${{ env.NOMOUNT_NAME }}
          path: ./nomount-module/*
