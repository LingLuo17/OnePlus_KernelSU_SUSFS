name: GetManager

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      ksu_variant:
        required: true
        type: string
      build_channel:
        description: "构建通道：正式 (Release) 对齐官方发行版；最新 (HEAD) 跟随上游最新提交（FinaSU 取 build-manager.yml 最新构建）"
        required: false
        type: string
        default: "正式 (Release)"
    outputs:
      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}
      managerVer:
        description: "官方 Manager 构建的实测版本号"
        value: ${{ jobs.get_ksu_manager.outputs.managerVer }}
      ksuCommit:
        description: "内核侧对齐用的提交 SHA（正式=Release 标签/官方构建提交；最新=SukiSU/BakaSU 默认分支 HEAD，FinaSU 最新构建提交）"
        value: ${{ jobs.get_ksu_manager.outputs.ksuCommit }}
      ksuBranch:
        description: "内核侧对齐提交所在的分支或 Release 标签（发布说明展示用）"
        value: ${{ jobs.get_ksu_manager.outputs.ksuBranch }}
      channelTag:
        description: "正式通道选用的 Release 标签（无正式版或最新通道时为空）"
        value: ${{ jobs.get_ksu_manager.outputs.channelTag }}
      managerCertSize:
        description: "FinaSU 管理器签名证书 DER 尺寸（0x 十六进制，内核第二信任槽对齐用）"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertSize }}
      managerCertHash:
        description: "FinaSU 管理器签名证书 SHA256（内核第二信任槽对齐用）"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertHash }}
jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
      # 输出3: Manager 实测版本号
      managerVer: ${{ steps.add_KSU.outputs.managerVer }}
      # 输出4: 内核侧对齐用的提交 SHA
      ksuCommit: ${{ steps.add_KSU.outputs.ksuCommit }}
      # 输出4b: 内核侧对齐提交所在分支/标签
      ksuBranch: ${{ steps.add_KSU.outputs.ksuBranch }}
      # 输出5: 正式通道选用的 Release 标签
      channelTag: ${{ steps.add_KSU.outputs.channelTag }}
      # 输出6/7: FinaSU 管理器签名证书（内核第二信任槽对齐用）
      managerCertSize: ${{ steps.add_KSU.outputs.managerCertSize }}
      managerCertHash: ${{ steps.add_KSU.outputs.managerCertHash }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出脚本仓库
        uses: actions/checkout@v6

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |
          if [ "${{ inputs.ksu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ inputs.ksu_variant }}" == "BakaSU" ]; then
            echo "This is the BakaSU variant"
            git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          elif [ "${{ inputs.ksu_variant }}" == "FinaSU" ]; then
            echo "This is the FinaSU variant"
            git clone https://github.com/LyraVoid/FinaSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU

          # 计算KSU版本号
          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.ksu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "${{ inputs.ksu_variant }}" == "FinaSU" ]; then
            # FinaSU 内核 Kbuild 与管理器 build.gradle.kts 均以 30000 + git 提交数计算版本
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          else
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 计算SUSFS版本号
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop"
          SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          echo $SUS_VERSION

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

          echo "KSU_VERSION (for manager consistency check): $KSU_VERSION / SUSFS module: $SUS_VERSION"

      # ==================== 构建通道 ====================
      # 正式：管理器取官方「正式版」Release（prerelease=false，标签提交 + 该 Release 的 APK）；
      #       上游没有正式版 Release 时（如 BakaSU 只有 rc 预发布），
      #       改用官方默认分支最新上传构建，内核仍锁定该构建提交
      # 最新：SukiSU/BakaSU 锁定默认分支 HEAD，管理器取与 HEAD 版本一致的最新构建（不限分支）；
      #       FinaSU 取 build-manager.yml 最新成功构建，内核锁定该构建提交
      - name: 选择管理器来源（构建通道）
        id: channel
        run: |
          CHANNEL_RAW="${{ inputs.build_channel }}"
          case "$CHANNEL_RAW" in
            最新*|latest*|HEAD*) CHANNEL_KIND="latest"; PIN_MODE="head" ;;
            *)                   CHANNEL_KIND="release"; PIN_MODE="pin" ;;
          esac
          echo "构建通道: $CHANNEL_RAW -> $CHANNEL_KIND (pin_mode=$PIN_MODE)"

          case "${{ inputs.ksu_variant }}" in
            "SukiSU") REPO="SukiSU-Ultra/SukiSU-Ultra"; PREF="universal" ;;
            "BakaSU") REPO="Baka-SU/BakaSU";           PREF="arm64" ;;
            "FinaSU") REPO="LyraVoid/FinaSU";          PREF="universal" ;;
            *) echo "::error::未知变体"; exit 1 ;;
          esac

          {
            echo "CHANNEL_KIND=$CHANNEL_KIND"
            echo "PIN_MODE=$PIN_MODE"
            echo "MANAGER_SOURCE=ci"
          } >> "$GITHUB_ENV"

          if [ "$CHANNEL_KIND" != "release" ]; then
            echo "最新通道：SukiSU/BakaSU 锁定默认分支 HEAD；FinaSU 取 build-manager.yml 最新构建"
            exit 0
          fi

          # ---------- 正式通道：解析官方 Release ----------
          REL_JSON=""
          for ATTEMPT in 1 2 3; do
            REL_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases?per_page=40") \
              && [ -n "$REL_JSON" ] && break
            echo "获取 $REPO 的 Release 列表失败，重试 ($ATTEMPT/3)..."
            REL_JSON=""
            sleep 5
          done

          # 选择规则：
          #   1) 跳过草稿与滚动发布标签（manager-ci / nightly / latest 等，其内容始终是最新 CI 产物）
          #   2) 只保留带 APK 资产的 Release（排除 debug / spoofed 包）
          #   3) 只接受正式版（prerelease=false）：rc / beta 等预发布属于"最新"范畴
          #   4) ABI 偏好：BakaSU 取 arm64-v8a，其余优先 universal
          PICK=""
          if [ -n "$REL_JSON" ]; then
            PICK=$(printf '%s' "$REL_JSON" | jq -r --arg pref "$PREF" '
              [ .[] | select(.draft == false) ]
              | map(. + { _ts: (.published_at // .created_at // "") })
              | sort_by(._ts) | reverse
              | map(. + {
                  _rolling: (.tag_name | test("(?i)^(manager-ci|manager_ci|nightly|latest|ci)$")),
                  _apks: [ .assets[]?
                           | select(.name | test("\\.apk$"; "i"))
                           | select(.name | test("(?i)debug|spoofed") | not) ]
                })
              | map(. + {
                  _apks: (._apks | sort_by(
                    if   (.name | test("(?i)" + $pref)) then 0
                    elif (.name | test("(?i)universal")) then 1
                    elif (.name | test("(?i)arm64")) then 2
                    else 3 end))
                })
              | map(select((._rolling | not) and ((._apks | length) > 0)))
              | map(select(.prerelease | not))
              | .[0] as $p
              | if $p then
                  [ $p.tag_name, $p._apks[0].name, $p._apks[0].browser_download_url ] | @tsv
                else empty end
            ')
          fi

          if [ -z "$PICK" ]; then
            echo "::notice::$REPO 没有可用的正式版 Release（仅预发布或未附 APK），改用官方默认分支最新上传构建（内核仍锁定该提交）"
            exit 0
          fi

          IFS=$'\t' read -r REL_TAG REL_APK_NAME REL_APK_URL <<< "$PICK"

          # 解析 Release 标签对应的提交（优先本地克隆，回退远端查询）
          REL_COMMIT=$(git -C KernelSU rev-parse "${REL_TAG}^{commit}" 2>/dev/null || true)
          if [ -z "$REL_COMMIT" ]; then
            # annotated tag 需解引用，否则拿到的是标签对象而非提交
            REL_COMMIT=$(git ls-remote "https://github.com/$REPO.git" "refs/tags/${REL_TAG}^{}" 2>/dev/null | awk '{print $1}')
          fi
          if [ -z "$REL_COMMIT" ]; then
            REL_COMMIT=$(git ls-remote "https://github.com/$REPO.git" "refs/tags/${REL_TAG}" 2>/dev/null | awk '{print $1}')
          fi
          if [ -z "$REL_COMMIT" ]; then
            echo "::warning title=正式通道回退::无法解析 Release $REL_TAG 对应的提交，改用官方默认分支最新上传构建"
            exit 0
          fi

          {
            echo "MANAGER_SOURCE=release"
            echo "REL_TAG=$REL_TAG"
            echo "REL_COMMIT=$REL_COMMIT"
            echo "REL_APK_NAME=$REL_APK_NAME"
            echo "REL_APK_URL=$REL_APK_URL"
          } >> "$GITHUB_ENV"

          echo "正式通道：Release $REL_TAG (${REL_COMMIT:0:8})，管理器 $REL_APK_NAME"

      # Manager resolution lives in scripts/get-manager.sh so the reusable
      # workflow stays below GitHub's per-step expression length limit.
      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        env:
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          BUILD_CHANNEL: ${{ inputs.build_channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/scripts/get-manager.sh"

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        run: |
          # 模块通过 sidex15/susfs4ksu-module 的 GitHub Releases 发布，拉取最新 Release 资产
          RELEASE_API="https://api.github.com/repos/sidex15/susfs4ksu-module/releases/latest"
          RELEASE_JSON=""
          for ATTEMPT in 1 2 3; do
            RELEASE_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_API") \
              && [ -n "$RELEASE_JSON" ] && break
            echo "获取 Release 信息失败，重试 ($ATTEMPT/3)..."
            sleep 5
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "无法获取 susfs4ksu-module 最新 Release 信息"
            exit 1
          fi

          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select((.name | contains("ksu_module_susfs")) and (.name | endswith(".zip"))) | .browser_download_url' | head -n 1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Release $TAG_NAME 中未找到 ksu_module_susfs 模块 zip"
            exit 1
          fi

          NAME="ksu_module_susfs.zip"
          echo "下载 SUSFS 模块: $NAME (Release $TAG_NAME)"
          if ! curl -sL --fail --retry 3 --max-time 120 -o "$NAME" "$ASSET_URL"; then
            echo "下载 SUSFS 模块失败: $ASSET_URL"
            exit 1
          fi
          echo "SUSFS_NAME=$TAG_NAME" >> $GITHUB_ENV

          # Release 资产本身即完整模块 zip，校验完整性后直接放入模块目录
          if ! unzip -t "$NAME" >/dev/null 2>&1; then
            echo "下载的 SUSFS 模块 zip 损坏"
            exit 1
          fi
          mkdir -p susfs-module
          mv "$NAME" "susfs-module/$NAME"
          ls -la susfs-module/

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "下载CI构建的KSU失败!"

      - name: 构建通道摘要
        if: always()
        run: |
          {
            echo "### 构建通道"
            echo ""
            echo "- 选择通道：${{ inputs.build_channel }}"
            echo "- 实际通道：${CHANNEL_KIND:-未知}（pin_mode=${PIN_MODE:-未知}）"
            echo "- 管理器来源：${MANAGER_SOURCE:-ci}"
            if [ "${MANAGER_SOURCE:-ci}" = "release" ]; then
              echo "- Release 标签：${REL_TAG:-未知}"
              echo "- 内核对齐提交：${REL_COMMIT:0:8}"
            fi
            echo "- 内核锁定提交：${{ steps.add_KSU.outputs.ksuCommit }}"
            echo "- 管理器版本：${{ steps.add_KSU.outputs.managerVer }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传APK
        if: env.MANAGER_FETCH_OK == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ksu_variant }}-Manager(${{ env.MANAGER_VERSION }})
          path: |
            manager-artifacts/**/*.apk
          if-no-files-found: error

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
