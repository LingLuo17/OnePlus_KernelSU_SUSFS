name: 'Build OnePlus Kernel with SukiSU/BakaSU/FinaSU'
description: 'Build OnePlus GKI kernel with SukiSU/BakaSU/FinaSU and SUSFS'

inputs:
  op_config_json:
    description: 'JSON string containing full device config'
    required: true
    type: string
  ksu_type:
    description: 'Select KSU Type'
    required: true
    type: choice
    options:
      - SukiSU
      - BakaSU
      - FinaSU
  ksu_branch_or_hash:
    description: 'KSU branch or commit hash (empty = auto-detect by ksu_type: SukiSU→builtin, BakaSU→main, FinaSU→master)'
    required: false
    type: string
    default: ""
  use_rekernel:
    description: 'Integrate the Re-Kernel driver in-tree (CONFIG_REKERNEL, netlink freeze/kill notifier)'
    required: false
    type: boolean
    default: false
  ksu_commit:
    description: 'Align the kernel-side KSU version source with the latest officially uploaded manager build: BakaSU checks KernelSU out at this commit, SukiSU rewrites its builtin Makefile REPO_BRANCH to it (empty = follow the passed branch/HEAD)'
    required: false
    type: string
    default: ''
  ksu_cert_size:
    description: 'FinaSU only: manager signing certificate DER size in hex (0x...) for the kernel second trusted signature slot (empty = extract from the latest FinaSU release APK)'
    required: false
    type: string
    default: ''
  ksu_cert_hash:
    description: 'FinaSU only: manager signing certificate SHA-256 hex for the kernel second trusted signature slot'
    required: false
    type: string
    default: ''
  custom_version:
    description: 'Custom kernel version suffix for LOCALVERSION (leading "x.y.z" kernel version prefix is stripped automatically, e.g. "6.6.118-mykernel" becomes "-mykernel"; empty = -<android> KMI tag, e.g. -android15)'
    required: false
    type: string
    default: ''
  susfs_commit_hash_or_branch:
    description: 'SUSFS branch or commit hash (empty = auto-detect by kernel version)'
    required: false
    type: string
    default: ""
  build_timestamp:
    description: 'Custom kernel build timestamp shown in uname -a. Format: Wkd Mon DD HH:MM:SS UTC YYYY, e.g. "Tue Dec  1 08:10:00 UTC 2026"; weekday must match the date. Leave empty to use the current build time (UTC+8).'
    required: false
    type: string
    default: ''
  optimize_level:
    description: 'Compiler optimization level (O2 or O3)'
    required: false
    type: string
    default: O2
  clean:
    description: 'Force clean build without ccache acceleration'
    required: false
    type: boolean
    default: false
  debug:
    description: 'Enable dumping debug related artifacts'
    required: false
    type: boolean
    default: false
  cache_stagger:
    description: 'Randomly delay cache upload to avoid contention in large matrices'
    required: false
    type: boolean
    default: true
  github_token:
    description: 'GitHub Token'
    required: true

outputs:
  kernel_version:
    description: 'Full kernel version string'
    value: ${{ steps.save_metadata.outputs.kernel_version }}
  ksu_version:
    description: 'KernelSU version number'
    value: ${{ steps.save_metadata.outputs.ksu_version }}
  ksu_type:
    description: 'KernelSU Variant'
    value: ${{ steps.save_metadata.outputs.ksu_type }}
  susfs_version:
    description: 'SUSFS version string'
    value: ${{ steps.save_metadata.outputs.susfs_version }}
  build_timestamp:
    description: 'Effective kernel build timestamp used in uname -a'
    value: ${{ steps.save_metadata.outputs.build_timestamp }}
  image_sha256:
    description: 'SHA256 hash of kernel Image'
    value: ${{ steps.collect_stats.outputs.image_sha256 }}
  zip_sha256:
    description: 'SHA256 hash of AnyKernel3 Zip'
    value: ${{ steps.create_zip.outputs.zip_sha256 }}
  warnings:
    description: 'Number of compiler warnings'
    value: ${{ steps.collect_stats.outputs.warnings_count }}
  build_time:
    description: 'Total build time in seconds'
    value: ${{ steps.collect_stats.outputs.build_time }}
  ccache_hit_rate:
    description: 'ccache hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.hit_rate }}
  ccache_direct_rate:
    description: 'ccache direct hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.direct_rate }}
  zip_name:
    description: 'Name of the generated flashable ZIP'
    value: ${{ steps.create_zip.outputs.zip_name }}
  kernel_release:
    description: 'Complete built kernel release string (uname -r tail), e.g. 6.6.30-android15-8-4k'
    value: ${{ steps.create_zip.outputs.kernel_release }}

runs:
  using: 'composite'
  steps:
    - name: Get Action info
      shell: bash
      env:
        ACTION_REPO_VAL: ${{ github.action_repository }}
        ACTION_REF_VAL: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        echo "ACTION_REPO=$ACTION_REPO_VAL" >> $GITHUB_ENV
        echo "ACTION_REF=$ACTION_REF_VAL" >> $GITHUB_ENV

    - name: 📥 Checkout Code
      uses: actions/checkout@v6
      with:
        repository: ${{ env.ACTION_REPO }}
        ref: ${{ env.ACTION_REF }}
        path: action-source
        fetch-depth: 1

    - name: Parse op_config_json
      shell: bash
      run: |
        set -euo pipefail
        echo '${{ inputs.op_config_json }}' > /tmp/config.json
        jq -r 'to_entries[] | "OP_\(.key | ascii_upcase)=\(.value)"' /tmp/config.json >> "$GITHUB_ENV"
        echo "Parsed config:"
        jq '.' /tmp/config.json

    - name: Validate Inputs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Validate inputs"
        model="$OP_MODEL"
        soc="$OP_SOC"
        branch="$OP_BRANCH"
        manifest="$OP_MANIFEST"
        android_version="$OP_ANDROID_VERSION"
        kernel_version="$OP_KERNEL_VERSION"
        os_version="$OP_OS_VERSION"
        hmbird="$OP_HMBIRD"
        susfs="$OP_SUSFS"
        opt="$OP_OPT"
        bbg="$OP_BBG"
        bbr="$OP_BBR"
        bbr3="$OP_BBR3"
        ttl="$OP_TTL"
        ip_set="$OP_IP_SET"
        rust_build="$OP_RUST_BUILD"
        lto="$OP_LTO"
        unicode="$OP_UNICODE"
        c_compiler="$OP_C_COMPILER"
        rust_compiler="$OP_RUST_COMPILER"
        zyc_compiler="$OP_ZYC_COMPILER"
        bindgen="$OP_BINDGEN"
        ds="$OP_DS"
        ntsync="$OP_NTSYNC"
        blacklist_modules="$OP_BLACKLIST_MODULES"
        optimize='${{ inputs.optimize_level }}'
        
        errors=()
        
        if [[ -z "$model" ]]; then
          errors+=("Input 'model' cannot be empty")
        elif [[ ! "$model" =~ ^OP ]]; then
          errors+=("Input 'model' does not start with 'OP'. Got: '$model'")
        fi
        
        if [[ -z "$soc" ]]; then
          errors+=("Input 'soc' cannot be empty")
        elif [[ ! "$soc" =~ ^[A-Za-z0-9_-]+$ ]]; then
          errors+=("Input 'soc' contains invalid characters. Allowed: letters, digits, underscore, dash. Got: '$soc'")
        fi
        
        if [[ -z "$branch" ]]; then
          errors+=("Input 'branch' cannot be empty")
        elif [[ ! "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
          errors+=("Input 'branch' contains invalid characters. Allowed: letters, digits, ., _, -, /. Got: '$branch'")
        fi
        
        if [[ -z "$manifest" ]]; then
          errors+=("Input 'manifest' cannot be empty")
        elif [[ "$manifest" == http*://* ]]; then
          if [[ ! "$manifest" =~ ^https:// ]]; then
            errors+=("Manifest URL must be HTTPS. Got: '$manifest'")
          fi
          if [[ ! "$manifest" =~ \.xml($|\?) ]]; then
            errors+=("Manifest URL should point to an XML file (.xml). Got: '$manifest'")
          fi
        else
          if [[ ! "$manifest" =~ \.xml$ ]]; then
            errors+=("Manifest filename must end with .xml. Got: '$manifest'")
          fi
          if [[ "$manifest" =~ [[:space:]] ]]; then
            errors+=("Manifest filename cannot contain spaces. Got: '$manifest'")
          fi
        fi
        
        if [[ -z "$android_version" ]]; then
          errors+=("Input 'android_version' cannot be empty")
        elif [[ ! "$android_version" =~ ^android[0-9]+$ ]]; then
          errors+=("Input 'android_version' contains invalid characters. Allowed: android followed by a number. Got: '$android_version'")
        fi
        
        if [[ -z "$kernel_version" ]]; then
          errors+=("Input 'kernel_version' cannot be empty")
        elif [[ ! "$kernel_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
          errors+=("Input 'kernel_version' contains invalid characters. Allowed: number in X.Y format. Got: '$kernel_version'")
        fi
        
        if [[ -z "$os_version" ]]; then
          errors+=("Input 'os_version' cannot be empty")
        elif [[ ! "$os_version" =~ ^A ]]; then
          errors+=("Input 'os_version' does not start with 'A'. Got: '$os_version'")
        fi
        
        if [[ -z "$hmbird" ]]; then
          errors+=("Input 'hmbird' cannot be empty")
        elif [[ "$hmbird" != "true" && "$hmbird" != "false" ]]; then
          errors+=("Input 'hmbird' contains invalid characters. Allowed: 'true' or 'false'. Got: '$hmbird'")
        fi
        
        if [[ -z "$susfs" ]]; then
          errors+=("Input 'susfs' cannot be empty")
        elif [[ "$susfs" != "true" && "$susfs" != "false" ]]; then
          errors+=("Input 'susfs' contains invalid characters. Allowed: 'true' or 'false'. Got: '$susfs'")
        fi
        
        if [[ -z "$opt" ]]; then
          errors+=("Input 'opt' cannot be empty")
        elif [[ "$opt" != "true" && "$opt" != "false" ]]; then
          errors+=("Input 'opt' contains invalid characters. Allowed: 'true' or 'false'. Got: '$opt'")
        fi
        
        if [[ -z "$bbg" ]]; then
          errors+=("Input 'bbg' cannot be empty")
        elif [[ "$bbg" != "true" && "$bbg" != "false" ]]; then
          errors+=("Input 'bbg' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbg'")
        fi
        
        if [[ -z "$bbr" ]]; then
          errors+=("Input 'bbr' cannot be empty")
        elif [[ "$bbr" != "true" && "$bbr" != "false" ]]; then
          errors+=("Input 'bbr' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbr'")
        fi
        
        if [[ -z "$bbr3" ]]; then
          errors+=("Input 'bbr3' cannot be empty")
        elif [[ "$bbr3" != "true" && "$bbr3" != "false" ]]; then
          errors+=("Input 'bbr3' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbr3'")
        fi
        
        if [[ -z "$ttl" ]]; then
          errors+=("Input 'ttl' cannot be empty")
        elif [[ "$ttl" != "true" && "$ttl" != "false" ]]; then
          errors+=("Input 'ttl' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ttl'")
        fi
        
        if [[ -z "$ip_set" ]]; then
          errors+=("Input 'ip_set' cannot be empty")
        elif [[ "$ip_set" != "true" && "$ip_set" != "false" ]]; then
          errors+=("Input 'ip_set' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ip_set'")
        fi
        
        if [[ -z "$rust_build" ]]; then
          errors+=("Input 'rust_build' cannot be empty")
        elif [[ "$rust_build" != "true" && "$rust_build" != "false" ]]; then
          errors+=("Input 'rust_build' contains invalid characters. Allowed: 'true' or 'false'. Got: '$rust_build'")
        fi
        
        if [[ -z "$lto" ]]; then
          errors+=("Input 'lto' cannot be empty")
        elif [[ "$lto" != "none" && "$lto" != "thin" && "$lto" != "full" ]]; then
          errors+=("Input 'lto' contains invalid characters. Allowed: 'thin', 'full' or 'none'. Got: '$lto'")
        fi
        
        if [[ -z "$unicode" ]]; then
          errors+=("Input 'unicode' cannot be empty")
        elif [[ "$unicode" != "true" && "$unicode" != "false" ]]; then
          errors+=("Input 'unicode' contains invalid characters. Allowed: 'true' or 'false'. Got: '$unicode'")
        fi
        
        # OP_C_COMPILER currently has no checks!
        
        # OP_RUST_COMPILER currently has no checks!
        
        # OP_ZYC_COMPILER currently has no checks!
        
        # OP_BINDGEN currently has no checks!
        
        # OP_BLACKLIST_MODULES currently has no checks!
        
        if [[ -z "$ds" ]]; then
          errors+=("Input 'ds' cannot be empty")
        elif [[ "$ds" != "true" && "$ds" != "false" ]]; then
          errors+=("Input 'ds' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ds'")
        fi
        
        if [[ -z "$ntsync" ]]; then
          errors+=("Input 'ntsync' cannot be empty")
        elif [[ "$ntsync" != "true" && "$ntsync" != "false" ]]; then
          errors+=("Input 'ntsync' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ntsync'")
        fi
        
        case "$optimize" in
          O2|O3) ;;
          *) errors+=("optimize_level must be O2 or O3. Got: '$optimize'"); ;;
        esac
        
        if [ ${#errors[@]} -ne 0 ]; then
          echo "Found ${#errors[@]} validation error(s):" >&2
          for error in "${errors[@]}"; do
            echo "  - $error" >&2
          done
          echo "::error::Input validation failed. See logs for details."
          exit 1
        else
          echo "✅ Input validation passed"
        fi
        echo "::endgroup::"

    - name: Setup Base Environment
      shell: bash
      run: |
        set -euo pipefail
        CONFIG="$OP_MODEL"
        echo "Creating folder for configuration: $CONFIG"
        mkdir -p "$CONFIG"
        echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"

    - name: Optimize Global Git Settings
      shell: bash
      run: |
        set -euo pipefail
        git config --global feature.manyFiles true
        git config --global core.fsmonitor true
        git config --global pack.sparse true
        git config --global http.sslVerify false

    - name: Sync Kernel Source
      id: sync-kernel-source
      uses: ./action-source/.github/actions/kernel-source-sync
      with:
        source_location: ${{ env.CONFIG }}
        debug: ${{ inputs.debug }}

    - name: Set Dir Paths
      shell: bash
      run: |
        set -euo pipefail
        CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
        ARTIFACTS_DIR="$CONFIG_DIR/artifacts"
        KERNEL_PLATFORM_DIR="$CONFIG_DIR/kernel_platform"
        COMMON_KERNEL_DIR="$KERNEL_PLATFORM_DIR/common"
        MSM_KERNEL_DIR="$KERNEL_PLATFORM_DIR/msm-kernel"
        AK3_DIR="$CONFIG_DIR/AnyKernel3"
        DEBUG_ARTIFACTS_DIR="$GITHUB_WORKSPACE/debug_artifacts"
        KERNEL_PATCHES_DIR="$GITHUB_WORKSPACE/kernel_patches"
        SUSFS_DIR="$GITHUB_WORKSPACE/susfs4ksu"
        KSU_DIR="$KERNEL_PLATFORM_DIR/KernelSU"
        mkdir -p "$ARTIFACTS_DIR"
        mkdir -p "$DEBUG_ARTIFACTS_DIR"
        
        # Save to environment for later steps
        echo "CONFIG_FOLDER=$CONFIG_DIR" >> "$GITHUB_ENV"
        echo "ARTIFACTS_FOLDER=$ARTIFACTS_DIR" >> "$GITHUB_ENV"
        echo "KERNEL_PLATFORM_FOLDER=$KERNEL_PLATFORM_DIR" >> "$GITHUB_ENV"
        echo "COMMON_KERNEL_FOLDER=$COMMON_KERNEL_DIR" >> "$GITHUB_ENV"
        echo "AK3_FOLDER=$AK3_DIR" >> "$GITHUB_ENV"
        echo "DEBUG_ARTIFACTS_FOLDER=$DEBUG_ARTIFACTS_DIR" >> "$GITHUB_ENV"
        echo "KERNEL_PATCHES_FOLDER=$KERNEL_PATCHES_DIR" >> "$GITHUB_ENV"
        echo "SUSFS_FOLDER=$SUSFS_DIR" >> "$GITHUB_ENV"
        echo "KSU_FOLDER=$KSU_DIR" >> "$GITHUB_ENV"
        
        # Official device display name (shared by zip, artifacts, cache key)
        if [[ "$OP_MODEL" =~ ^(.+)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          dev="${BASH_REMATCH[1]}"; ver="${BASH_REMATCH[2]}"
        else
          dev="$OP_MODEL"; ver=""
        fi
          case "$dev" in
            OP-ACE) flat="OnePlus-Ace" ;;
            OP-ACE-2) flat="OnePlus-Ace2" ;;
            OP-ACE-2-PRO) flat="OnePlus-Ace2-Pro" ;;
            OP-ACE-2V) flat="OnePlus-Ace2V" ;;
            OP-ACE-3) flat="OnePlus-Ace3" ;;
            OP-ACE-3-PRO) flat="OnePlus-Ace3-Pro" ;;
            OP-ACE-3V) flat="OnePlus-Ace3V" ;;
            OP-ACE-5) flat="OnePlus-Ace5" ;;
            OP-ACE-5-PRO) flat="OnePlus-Ace5-Pro" ;;
            OP-ACE-5-RACE) flat="OnePlus-Ace5-RACE" ;;
            OP-ACE-5-ULTRA) flat="OnePlus-Ace5-Ultra" ;;
            OP-ACE-6) flat="OnePlus-Ace6" ;;
            OP-ACE-6-ULTRA) flat="OnePlus-Ace6-Ultra" ;;
            OP-ACE-6T) flat="OnePlus-Ace6T" ;;
            OP-ACE-RACE) flat="OnePlus-Ace-RACE" ;;
            OP-ACE-PRO) flat="OnePlus-Ace-Pro" ;;
            OP-N6) flat="OnePlus-N6" ;;
            OP-N6X) flat="OnePlus-N6x" ;;
            OP-NORD-3) flat="OnePlus-Nord3" ;;
            OP-NORD-4) flat="OnePlus-Nord4" ;;
            OP-NORD-4-CE) flat="OnePlus-Nord4-CE" ;;
            OP-NORD-5) flat="OnePlus-Nord5" ;;
            OP-NORD-6) flat="OnePlus-Nord6" ;;
            OP-NORD-CE-5) flat="OnePlus-Nord-CE5" ;;
            OP-NORD-CE4-LITE) flat="OnePlus-Nord-CE4Lite" ;;
            OP-NORD-CE6) flat="OnePlus-Nord-CE6" ;;
            OP-NORD-CE6-LITE) flat="OnePlus-Nord-CE6Lite" ;;
            OP-NORD-N30-SE) flat="OnePlus-Nord-N30-SE" ;;
            OP-OPEN) flat="OnePlus-Open" ;;
            OP-PAD-2-MT6991) flat="OnePlus-Pad2-MT6991" ;;
            OP-PAD-2-PRO) flat="OnePlus-Pad2-Pro" ;;
            OP-PAD-2-SM8650) flat="OnePlus-Pad2-SM8650" ;;
            OP-PAD-3-MT6897) flat="OnePlus-Pad3-MT6897" ;;
            OP-PAD-3-PRO) flat="OnePlus-Pad3-Pro" ;;
            OP-PAD-3-SM8750) flat="OnePlus-Pad3-SM8750" ;;
            OP-PAD-4) flat="OnePlus-Pad4" ;;
            OP-PAD-GO-2) flat="OnePlus-Pad-GO2" ;;
            OP-PAD-LITE) flat="OnePlus-Pad-Lite" ;;
            OP-PAD-MT6983) flat="OnePlus-Pad-MT6983" ;;
            OP-PAD-PRO) flat="OnePlus-Pad-Pro" ;;
            OP-TURBO-6) flat="OnePlus-Turbo6" ;;
            OP-TURBO-6V) flat="OnePlus-Turbo6V" ;;
            OP-TURBO-6X) flat="OnePlus-Turbo6X" ;;
            OP10pro) flat="OnePlus-10Pro" ;;
            OP10r) flat="OnePlus-10R" ;;
            OP10t) flat="OnePlus-10T" ;;
            OP11) flat="OnePlus-11" ;;
            OP11r) flat="OnePlus-11R" ;;
            OP12) flat="OnePlus-12" ;;
            OP12r) flat="OnePlus-12R" ;;
            OP13) flat="OnePlus-13" ;;
            OP13-CPH) flat="OnePlus-13-CPH" ;;
            OP13-PJZ) flat="OnePlus-13-PJZ" ;;
            OP13S) flat="OnePlus-13S" ;;
            OP13T) flat="OnePlus-13T" ;;
            OP13r) flat="OnePlus-13R" ;;
            OP15) flat="OnePlus-15" ;;
            OP15T) flat="OnePlus-15T" ;;
            OP15r) flat="OnePlus-15R" ;;
            *) flat="$dev" ;;
          esac
        [ -n "$ver" ] && flat="$flat-$ver"
        MODEL_FLAT="$flat"
        echo "MODEL_FLAT=$MODEL_FLAT" >> "$GITHUB_ENV"

        DEBUG_ZIP_NAME="debug_${MODEL_FLAT}_${OP_OS_VERSION}.zip"
        echo "DEBUG_ZIP_NAME=$DEBUG_ZIP_NAME" >> "$GITHUB_ENV"

    - name: Set Kernel build-tools to Path
      shell: bash
      run: |
        # Set Kernel build-tools to Path
        set -euo pipefail
        echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux-x86/bin/" >> $GITHUB_PATH
        echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux_musl-x86/bin/" >> $GITHUB_PATH

    - name: Get Kernel Version Info
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Get kernel version"
        cd "$COMMON_KERNEL_FOLDER"
        
        CONFIG_FILES=("build.config.common" "build.config.constants")
        BRANCH_LINE=""
        for f in "${CONFIG_FILES[@]}"; do
          if [ -f "$f" ]; then
            l=$(grep '^[[:space:]]*BRANCH=' "$f" || true)
            if [ -n "$l" ]; then BRANCH_LINE="$l"; break; fi
          fi
        done
        
        if [ -z "$BRANCH_LINE" ]; then
          echo "::error::No BRANCH= found in config files"; exit 1
        fi
        
        BRANCH_VALUE="${BRANCH_LINE#*=}"
        ANDROID_VERSION="${BRANCH_VALUE%-*}"
        
        if [ -z "$ANDROID_VERSION" ]; then
          echo "::error::Could not parse android version from BRANCH=$BRANCH_VALUE"
          exit 1
        fi
        
        # KMI generation (the "8" in the stock release 6.6.30-android15-8-...) ships in
        # build.config.common on OnePlusOSS trees (build.config.constants on some branches)
        KMI_LINE=""
        for f in "${CONFIG_FILES[@]}"; do
          if [ -f "$f" ]; then
            k=$(grep '^[[:space:]]*KMI_GENERATION=' "$f" || true)
            if [ -n "$k" ]; then KMI_LINE="$k"; break; fi
          fi
        done
        KMI_GENERATION="${KMI_LINE#*=}"
        KMI_GENERATION="${KMI_GENERATION//[[:space:]]/}"
        if [ -z "$KMI_GENERATION" ]; then
          echo "::warning::KMI_GENERATION not found in build.config.common/build.config.constants; the kernel release will omit the KMI generation"
        else
          echo "✅ KMI generation: $KMI_GENERATION"
        fi
        
        # Resolve the common-kernel source commit that OnePlus ships for this build
        # (the "g<hash>" in the stock release 6.6.30-android15-8-g0261dbe3cf7e-ab...-4k).
        # The manifest pins it either as a 40-char commit or as a branch to resolve.
        MANIFEST_XML="$CONFIG_FOLDER/manifest.xml"
        KPROJ_LINE=""
        if [ -f "$MANIFEST_XML" ]; then
          # project element owning a linkfile that lands at kernel_platform/common
          # (closest <project> line above it), else the project whose path IS
          # kernel_platform/common / common
          KPROJ_LINE="$(grep -B3 'dest="kernel_platform/common"' "$MANIFEST_XML" | grep '<project ' | tail -n1 || true)"
          [ -n "$KPROJ_LINE" ] || KPROJ_LINE="$(grep '<project .*path="kernel_platform/common"' "$MANIFEST_XML" | head -n1 || true)"
          [ -n "$KPROJ_LINE" ] || KPROJ_LINE="$(grep '<project .*path="common"' "$MANIFEST_XML" | head -n1 || true)"
        fi
        KPROJ_NAME="$(printf '%s' "$KPROJ_LINE" | sed -n 's/.*[[:space:]]name="\([^"]*\)".*/\1/p')"
        KPROJ_REV="$(printf '%s' "$KPROJ_LINE" | sed -n 's/.*[[:space:]]revision="\([^"]*\)".*/\1/p')"
        KPROJ_REMOTE="$(printf '%s' "$KPROJ_LINE" | sed -n 's/.*[[:space:]]remote="\([^"]*\)".*/\1/p')"
        KPROJ_FETCH="https://github.com/OnePlusOSS"
        if [ -n "$KPROJ_REMOTE" ]; then
          rf="$(grep "name=\"$KPROJ_REMOTE\"" "$MANIFEST_XML" | grep '<remote ' | sed -n 's/.*[[:space:]]fetch="\([^"]*\)".*/\1/p' | head -n1 || true)"
          [ -n "$rf" ] && KPROJ_FETCH="${rf%/}"
        fi
        KERNEL_SRC_HASH12=""
        if [ -n "$KPROJ_NAME" ] && [ -n "$KPROJ_REV" ]; then
          if [[ "$KPROJ_REV" =~ ^[0-9a-f]{40}$ ]]; then
            KERNEL_SRC_HASH12="${KPROJ_REV:0:12}"
          else
            full_sha="$(timeout 60 git ls-remote "${KPROJ_FETCH}/${KPROJ_NAME}.git" "$KPROJ_REV" 2>/dev/null | awk '{print $1}' | head -n1 || true)"
            if [ ${#full_sha} -ge 12 ]; then
              KERNEL_SRC_HASH12="${full_sha:0:12}"
            fi
          fi
          if [ -n "$KERNEL_SRC_HASH12" ]; then
            echo "✅ Kernel source commit: $KERNEL_SRC_HASH12 ($KPROJ_NAME @ $KPROJ_REV)"
          else
            echo "::warning::Could not resolve the common-kernel source commit ($KPROJ_NAME @ $KPROJ_REV); the kernel release will omit the g<hash>-ab<build> segment"
          fi
        else
          echo "::warning::Common-kernel project not found in manifest.xml; the kernel release will omit the g<hash>-ab<build> segment"
        fi
        
        VERSION=$(grep '^VERSION *=' Makefile | awk '{print $3}')
        PATCHLEVEL=$(grep '^PATCHLEVEL *=' Makefile | awk '{print $3}')
        SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | awk '{print $3}')
        FULL_VERSION="$VERSION.$PATCHLEVEL.$SUBLEVEL"

        # The config stem declares the kernel sub-version it targets (e.g.
        # OnePlus-Turbo6X-6.1.157), but most manifests pin a moving OnePlus
        # branch, which OnePlus can bump underneath us. Fail loudly instead of
        # silently building the newer kernel under the old config name: rename
        # the drifted config to the new version, or pin the manifest to the old
        # sources if the old variant must stay buildable.
        if [[ "$MODEL_FLAT" =~ -([0-9]+\.[0-9]+\.[0-9]+)$ ]] \
           && [ "${BASH_REMATCH[1]}" != "$FULL_VERSION" ]; then
          echo "::error::Config '$MODEL_FLAT' declares kernel ${BASH_REMATCH[1]} but the pinned manifest source is $FULL_VERSION. Update the config name/model to the actual version (and pin the old sources in a separate manifest/config if the old variant must remain buildable)."
          exit 1
        fi
        
        cd "$ARTIFACTS_FOLDER"
        echo "$ANDROID_VERSION-$FULL_VERSION" > "${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$OP_OS_VERSION" >> "${OP_MODEL}_${OP_OS_VERSION}.txt"
        
        {
          echo "ANDROID_VER=$ANDROID_VERSION"
          echo "KERNEL_VER=$VERSION.$PATCHLEVEL"
          echo "TKERNEL_VER=$FULL_VERSION"
          echo "KERNEL_FULL_VER=$ANDROID_VERSION-$FULL_VERSION"
          echo "KERNEL_KMI_GENERATION=$KMI_GENERATION"
          echo "KERNEL_SRC_HASH12=$KERNEL_SRC_HASH12"
          if [ "${{ env.OP_SUSFS }}" = true ]; then
            echo "SUSFS_KERNEL_BRANCH=gki-$ANDROID_VERSION-$VERSION.$PATCHLEVEL"
          fi
        } >> "$GITHUB_ENV"
        
        echo "✅ Detected: $ANDROID_VERSION-$FULL_VERSION"
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          echo "   SUSFS Branch: gki-$ANDROID_VERSION-$VERSION.$PATCHLEVEL"
        fi
        echo "::endgroup::"

    - name: 🏷️ Set Build Identity & Build Timestamp
      shell: bash
      env:
        CUSTOM_BUILD_TIMESTAMP: ${{ inputs.build_timestamp }}
      run: |
        set -euo pipefail
        echo "::group::Set build user/host"
                
        BUILD_USER="OnePlus"
        BUILD_HOST="ubuntu-build"
        
        echo "BUILD_USER=$BUILD_USER" >> "$GITHUB_ENV"
        echo "BUILD_HOST=$BUILD_HOST" >> "$GITHUB_ENV"
        
        echo ""
        echo "✅ Build identity configured:"
        echo "   User: $BUILD_USER"
        echo "   Host: $BUILD_HOST"
        echo "::endgroup::"

        echo "::group::Resolve kernel build timestamp"
        if [ -n "$CUSTOM_BUILD_TIMESTAMP" ]; then
          # AnyKernel3-style custom build timestamp: normalize spaces -> validate format -> parse -> verify weekday
          CUSTOM_BUILD_TIMESTAMP="$(printf '%s' "$CUSTOM_BUILD_TIMESTAMP" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/[[:space:]][[:space:]]*/ /g')"
          TIME_REGEX='^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) ( ?[1-9]|0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] UTC [0-9]{4}$'
          if [[ ! "$CUSTOM_BUILD_TIMESTAMP" =~ $TIME_REGEX ]]; then
            echo "::error::build_timestamp must look like 'Tue Dec  1 08:10:00 UTC 2026' (Wkd Mon DD HH:MM:SS UTC YYYY, weekday must match the date). Got: '$CUSTOM_BUILD_TIMESTAMP'"
            exit 1
          fi
          # Parse into a canonical UTC stamp (also rejects impossible dates such as Feb 30)
          NORMALIZED_TS="$(LC_ALL=C TZ=UTC date -u -d "$CUSTOM_BUILD_TIMESTAMP" +'%a %b %e %T UTC %Y' 2>/dev/null || true)"
          if [ -z "$NORMALIZED_TS" ]; then
            echo "::error::build_timestamp is not a valid UTC date/time. Got: '$CUSTOM_BUILD_TIMESTAMP'"
            exit 1
          fi
          # GNU date ignores the weekday in its input, so parse the real weekday separately and compare
          TYPED_WD="${CUSTOM_BUILD_TIMESTAMP%% *}"
          REAL_WD="$(LC_ALL=C TZ=UTC date -u -d "${CUSTOM_BUILD_TIMESTAMP#* }" +%a 2>/dev/null || true)"
          if [ -z "$REAL_WD" ] || [ "$TYPED_WD" != "$REAL_WD" ]; then
            echo "::error::build_timestamp weekday does not match the date. Expected: ${REAL_WD:-unknown} (normalized: $NORMALIZED_TS)"
            exit 1
          fi
          export KBUILD_BUILD_TIMESTAMP="$NORMALIZED_TS"
          echo "📅 Using custom build timestamp: $KBUILD_BUILD_TIMESTAMP"
        else
          export KBUILD_BUILD_TIMESTAMP="$(TZ='CST-8' date +'%a %b %d %T UTC %Y')"
          echo "📅 Using current build timestamp (UTC+8): $KBUILD_BUILD_TIMESTAMP"
        fi
        echo "EFFECTIVE_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> "$GITHUB_ENV"
        echo "::endgroup::"

    - name: Check or Detect Clang
      shell: bash
      run: |
        # Check or Detect Clang
        set -euo pipefail
        echo "::group::Detect Clang"
        CLANG_FOUND=false
        CLANG_BIN=""
        
        if [ -n "$OP_ZYC_COMPILER" ]; then
          # Priority 1: User explicitly wants ZyC compiler
          echo "OP_ZYC_COMPILER detected as download link: $OP_ZYC_COMPILER"
          
          ZYC_DIR="$CONFIG_FOLDER/compiler/zyc"
          TEMP_TAR="$CONFIG_FOLDER/compiler.tar.gz"
          mkdir -p "$ZYC_DIR"
          
          echo "Downloading ZyC Clang from link..."
          
          max_retries=5
          attempt=1
          download_success=false
          
          while [ $attempt -le $max_retries ]; do
            echo "Download attempt $attempt/$max_retries..."
            
            if curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 60 -o "$TEMP_TAR" "$OP_ZYC_COMPILER"; then
                echo "Download successful."
                download_success=true
                break
            else
                echo "Download failed (attempt $attempt)."
                rm -f "$TEMP_TAR" 2>/dev/null
                if [ $attempt -eq $max_retries ]; then
                    echo "Error: Failed to download ZyC Clang after $max_retries attempts."
                    break
                fi
                attempt=$((attempt + 1))
                sleep 8
            fi
          done
        
          if [ "$download_success" = true ]; then
            # Extract
            echo "Extracting to $ZYC_DIR ..."
            if tar -xzf "$TEMP_TAR" -C "$ZYC_DIR" 2>/dev/null; then
              # Symlink extraction fix
              tar -xzf "$TEMP_TAR" -C "$ZYC_DIR" 2>/dev/null || true
              # Cleanup
              rm -f "$TEMP_TAR"
              
              # Verify clang exists
              if [ -x "$ZYC_DIR/bin/clang" ]; then
                  CLANG_BIN="$ZYC_DIR/bin"
                  CLANG_FOUND=true
                  echo "ZyC Clang successfully downloaded and extracted."
                  echo "Using: $CLANG_BIN/clang"
              else
                  echo "Warning: Extraction done, but clang binary not found at $ZYC_DIR/bin/clang"
              fi
            else
                echo "Error: Failed to extract the tar.gz file."
                rm -f "$TEMP_TAR"
            fi
          fi
        
        elif [ -n "$OP_C_COMPILER" ]; then
          # Priority 2: User specified a custom C compiler
          if [ -x "$CONFIG_FOLDER/$OP_C_COMPILER/clang" ]; then
            CLANG_BIN="$CONFIG_FOLDER/$OP_C_COMPILER"
            CLANG_FOUND=true
          else
            echo "Warning: OP_C_COMPILER='$OP_C_COMPILER' but clang binary not found at $CONFIG_FOLDER/$OP_C_COMPILER/clang"
          fi
        fi
        
        if [ "$CLANG_FOUND" = false ]; then
          # Priority 3: Auto-detect from prebuilts (when both variables are empty / user clang not found)
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/clang/host/linux-x86" ] || continue
            latest=$(ls -d "$base/clang/host/linux-x86/clang-r"* 2>/dev/null | sort -V | tail -n1 || true)
            if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
              CLANG_BIN="$latest/bin"
              CLANG_FOUND=true
              break
            fi
          done
        fi
        
        if [ "$CLANG_FOUND" = false ] && command -v clang >/dev/null 2>&1; then
          # Priority 4: Fallback to system-installed clang
          CLANG_BIN="$(dirname "$(command -v clang)")"
          CLANG_FOUND=true
          echo "Using system clang."
        fi
        
        [ "$CLANG_FOUND" = true ] || { echo "::error::No clang toolchain found"; exit 1; }
        
        echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"
        
        CLANG_VERSION="$("$CLANG_BIN/clang" --version | head -n1)"
        echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"
        
        echo "Derive Clang fingerprint"
        
        short="$("${CLANG_BIN}/clang" --version | sed -n '1s/.*clang-r\([0-9.]\+\).*/\1/p')"
        
        if [ -z "$short" ]; then
          short="$("${CLANG_BIN}/clang" --version | sha256sum | cut -c1-8)"
          echo "⚠️ Could not extract clang-r version, using hash: $short"
        else
          echo "✅ Clang version fingerprint: $short"
        fi
        
        echo "CLANG_VERSION_SHORT=$short" >> "$GITHUB_ENV"
        echo "$CLANG_BIN" >> $GITHUB_PATH
        echo "LIBCLANG_PATH=$CLANG_BIN/../lib" >> "$GITHUB_ENV"
        
        echo "✅ Detected Clang: $CLANG_VERSION"
        echo "::endgroup::"

    - name: Check or Detect Rust & bindgen
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true' }}
      run: |
        # Check or Detect Rust & bindgen
        set -euo pipefail
        echo "::group::Detect Rust & bindgen"
        RUSTC_FOUND=false
        BINDGEN_FOUND=false
        
        if [ -z "$OP_RUST_COMPILER" ]; then
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/rust/linux-x86" ] || continue
            latest=$(ls -d "$base/rust/linux-x86/1."* 2>/dev/null | sort -V | head -n1 || true)
            if [ -n "$latest" ] && [ -x "$latest/bin/rustc" ]; then
              RUSTC_BIN="$latest/bin"
              RUSTC_FOUND=true
              break
            fi
          done
        else
          if [ -x "$CONFIG_FOLDER/$OP_RUST_COMPILER/rustc" ]; then
            RUSTC_BIN="$CONFIG_FOLDER/$OP_RUST_COMPILER"
            RUSTC_FOUND=true
          fi
        fi
        
        if [ -z "$OP_BINDGEN" ]; then
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/clang-tools/linux-x86" ] || continue
            if [ -x "$base/clang-tools/linux-x86/bin/bindgen" ]; then
              BINDGEN_BIN="$base/clang-tools/linux-x86/bin"
              BINDGEN_FOUND=true
              chmod +x "$base/clang-tools/linux-x86/bin/bindgen"
              break
            fi
          done
        else
          if [ -x "$CONFIG_FOLDER/$OP_BINDGEN/bindgen" ]; then
            BINDGEN_BIN="$CONFIG_FOLDER/$OP_BINDGEN"
            BINDGEN_FOUND=true
            chmod +x "$CONFIG_FOLDER/$OP_BINDGEN/bindgen"
          fi
        fi
        
        [ "$RUSTC_FOUND" = true ] || { echo "::error::No RUST toolchain found"; exit 1; }
        [ "$BINDGEN_FOUND" = true ] || { echo "::warning::No bindgen found"; }
        
        echo "RUSTC_BIN_PATH=$RUSTC_BIN" >> "$GITHUB_ENV"
        RUSTC_VERSION="$("$RUSTC_BIN/rustc" --version | head -n1)"
        echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"
        echo "RUSTC=$RUSTC_BIN/rustc" >> "$GITHUB_ENV"
        echo "$RUSTC_BIN" >> $GITHUB_PATH
        echo "✅ Detected RUSTC: $RUSTC_VERSION"
        
        if [ "$BINDGEN_FOUND" = true ]; then
          echo "BINDGEN_BIN_PATH=$BINDGEN_BIN" >> "$GITHUB_ENV"
          BINDGEN_VERSION="$("$BINDGEN_BIN/bindgen" --version | head -n1)"
          echo "BINDGEN_VERSION=$BINDGEN_VERSION" >> "$GITHUB_ENV"
          echo "$BINDGEN_BIN" >> $GITHUB_PATH
          echo "BINDGEN=$BINDGEN_BIN/bindgen" >> "$GITHUB_ENV"
          echo "✅ Detected BINDGEN: $BINDGEN_VERSION"
        fi
        
        echo "::endgroup::"

    - name: Install bindgen only (no rustc)
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true'  && !env.BINDGEN_BIN_PATH }}
      run: |
        # Install bindgen via cargo (no full rustc needed)
        set -euo pipefail
        echo "::group::Install bindgen only (no rustc)"
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
        source $HOME/.cargo/env
        
        # Install bindgen CLI only (~50-100MB total)
        cargo install bindgen-cli --version 0.69.5
        
        BINDGEN=$(which bindgen)
        BINDGEN_BIN=$(dirname $BINDGEN)
        echo "$BINDGEN_BIN" >> $GITHUB_PATH
        echo "BINDGEN=$BINDGEN" >> "$GITHUB_ENV"
        
        # Verify
        bindgen --version
        echo "::endgroup::"

    - name: Test Rust & bindgen
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true' }}
      run: |
        # Test Rust & bindgen
        set -euo pipefail
        echo "::group::Test Rust & bindgen"
        cd "$COMMON_KERNEL_FOLDER"
        export RUSTTARGET="aarch64-linux-android"
        make V=1 rustavailable
        echo "::endgroup::"

    - name: Restore ccache cache
      id: restore-ccache-cache
      uses: ./action-source/.github/actions/cache/restore
      if: ${{ inputs.clean == false || inputs.clean == 'false' }}
      with:
        cache_path: ${{ env.CCACHE_DIR }}
        cache_key: ${{ inputs.ksu_type }}-v3-${{ env.MODEL_FLAT }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
        cache_bucket: "ccache-cache"
        debug: ${{ inputs.debug }}
        restore_keys: |
          ${{ inputs.ksu_type }}-v3-${{ env.MODEL_FLAT }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-
          ${{ inputs.ksu_type }}-v3-${{ env.MODEL_FLAT }}-${{ env.OP_OS_VERSION }}-

    - name: Check and Prepare Caches
      shell: bash
      run: |
        echo "::group::Check ccache"
        set -euo pipefail
        
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        
        echo "Current ccache configuration:"
        ccache -p
        
        if [ -d "$CCACHE_DIR" ] && find "$CCACHE_DIR" -maxdepth 2 -type f -print -quit 2>/dev/null | grep -q .; then
          echo "✅ Restored cache found"
          echo ""
          echo "Pre-build cache statistics:"
          ccache -s | head -n 20
          
          echo "Updating atime to achive cache eviction"
          find ${{ env.CCACHE_DIR }} -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} +
        else
          echo "⚠️ No existing cache - building from scratch"
          echo "Cache will be populated for future builds"
        fi
        
        ccache -z
        rm -f "$CCACHE_DIR/ccache.log"
        
        # Blacklist Risky files from ccache
        sed -i '1i // CI_RUN_ID: ${{ github.run_id }}' "$COMMON_KERNEL_FOLDER/kernel/configs.c"
        sed -i '1i // ccache:disable' "$COMMON_KERNEL_FOLDER/kernel/configs.c"

        if head -n 1 "$COMMON_KERNEL_FOLDER/kernel/configs.c" | grep -q "// ccache:disable"; then
            echo "Success: ccache is disabled for this file!"
        else
            echo "Error: Modification failed or line is missing."
        fi

        echo "::endgroup::"

    - name: Fetch SusFS and Other Dependencies
      shell: bash
      run: |
        echo "::group::Fetch dependencies"
        set -euo pipefail
        echo "Fetching SusFS and other dependencies..."
        
        
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          # Determine SUSFS branch/commit to use
          SUSFS_INPUT="${{ inputs.susfs_commit_hash_or_branch }}"
          
          # Default SUSFS branches for each kernel version
          declare -A DEFAULT_SUSFS=(
            ["android12-5.10"]="gki-android12-5.10"
            ["android13-5.15"]="gki-android13-5.15"
            ["android14-6.1"]="gki-android14-6.1"
            ["android15-6.6"]="gki-android15-6.6"
            ["android16-6.12"]="gki-android16-6.12"
          )
          
          # Determine which SUSFS ref to use
          KERNEL_KEY="${{ env.ANDROID_VER }}-${{ env.KERNEL_VER }}"
          if [ -z "$SUSFS_INPUT" ]; then
            # use kernel-specific default
            SUSFS_BRANCH="${DEFAULT_SUSFS[$KERNEL_KEY]:-gki-android15-6.6}"
            echo "ℹ️  Using default SUSFS branch for $KERNEL_KEY: $SUSFS_BRANCH"
          else
            # 40-char hash or branch/commit passed directly
            SUSFS_BRANCH="$SUSFS_INPUT"
            echo "🔧 Using resolved SUSFS ref: $SUSFS_BRANCH"
          fi

          # config/config 自定义提交优先：custom=true 且对应分支填有 40 位 hash 时
          # 固定使用该提交（回退到稳定版本 / 规避上游兼容性问题）
          SUSFS_PINNED=""
          if [ -f "$GITHUB_WORKSPACE/scripts/custom_commit.sh" ] && \
             bash "$GITHUB_WORKSPACE/scripts/custom_commit.sh" enabled 2>/dev/null; then
            SUSFS_PINNED="$(bash "$GITHUB_WORKSPACE/scripts/custom_commit.sh" get "$SUSFS_BRANCH" || true)"
          fi
          if [ -n "$SUSFS_PINNED" ]; then
            SUSFS_BRANCH="$SUSFS_PINNED"
            echo "📌 config/config: SUSFS pinned to $SUSFS_BRANCH"
          fi
        fi
        
        retry_fetch_archive() {
          local url="$1"
          local branch="${2:-main}"
          local max_attempts=3
          local attempt=1
          
          local repo_name=$(basename "$url" .git)
          local safe_branch=$(echo "$branch" | tr '/' '_')
          local archive_name="${repo_name}_${safe_branch}.tar.gz"
          local shm_path="/dev/shm/$archive_name"
          
          local nproc=$(nproc 2>/dev/null || echo 4)
          
          local aria_log_flags="--quiet --summary-interval=0"
          if [ "${{ inputs.debug }}" = "true" ]; then
              aria_log_flags="--summary-interval=5" # Show progress every 5s in debug
          fi
          
          local aria2_headers=(
            "--header=User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            "--header=Accept: */*"
            "--header=Connection: keep-alive"
          )
          
          local download_url=""
          if [[ "$url" == *"github.com"* ]]; then
              download_url="${url%.git}/archive/refs/heads/${branch}.tar.gz"
          elif [[ "$url" == *"gitlab.com"* ]]; then
              download_url="${url%.git}/-/archive/${branch}/${repo_name}-${branch}.tar.gz"
          else
              echo "::error::Unsupported host: $url"
              return 1
          fi
          
          while [ $attempt -le $max_attempts ]; do
              echo " Attempt $attempt/$max_attempts: High-speed fetch for $repo_name ($branch)"
              
              if aria2c -x16 -s16 -j16 -k1M --retry-wait=2 --max-tries=5 -d "/dev/shm" -o "$archive_name" --allow-overwrite=true "${aria2_headers[@]}" $aria_log_flags "$download_url"; then
                  mkdir -p "$repo_name"
                  if tar -I "pigz -p $nproc -b 256" -x --record-size=1M -f "$shm_path" -C "$repo_name" --strip-components=1 --no-same-owner; then
                      echo "✅ Success: $repo_name synced"
                      rm -f "$shm_path"
                      return 0
                  fi
              fi
              
              echo "⚠️ Attempt $attempt failed, clearing RAM and retrying..."
              rm -rf "$repo_name" "$shm_path" 2>/dev/null
              sleep 5
              attempt=$((attempt + 1))
          done
          
          echo "::error::All attempts failed for $url"
          return 1
        }
        
        retry_clone() {
          local url="$1"
          local branch="${2:-main}"
          local depth="${3:-1}"
          local dir="$(basename "$url" .git)"
          local max_attempts=3
          local attempt=1
          
          # Build git clone args
          local clone_args=(--branch "$branch")
          if [ "$depth" != "0" ] && [ -n "$depth" ]; then
            clone_args+=(--depth "$depth")
          fi
          
          while [ $attempt -le $max_attempts ]; do
            echo "🔄 Attempt $attempt/$max_attempts: cloning $url ($branch)${depth:+ [depth=$depth]}"
            
            # Clone with dynamic args
            git clone "${clone_args[@]}" "$url" "$dir" && {
              echo "✅ Success"
              return 0
            }
            
            echo "❌ Failed, cleaning up..."
            rm -rf "$dir" 2>/dev/null
            sleep $((attempt++ * 5))
          done
          
          echo "💥 All attempts failed"
          return 1
        }
        
        retry_clone "https://github.com/WildKernels/kernel_patches.git" "main" "1"

        if [ "${{ env.OP_SUSFS }}" = true ]; then
          echo "Using SUSFS branch/commit: $SUSFS_BRANCH"
          # config/config 锁定具体提交时改走定向 git 获取：GitLab 归档接口
          # （/-/archive/<ref>/）只接受分支/标签名，传 40 位 SHA 会返回 403，
          # 而 toolchain-cache 只有分支归档（susfs-<branch>.tar.gz），因此
          # 直接 fetch 该提交（--depth 1 浅取，体积与归档相当）。
          if [[ "$SUSFS_BRANCH" =~ ^[0-9a-f]{40}$ ]]; then
            echo "📌 Pinned SUSFS commit from config/config: $SUSFS_BRANCH"
            rm -rf "$SUSFS_FOLDER"
            PIN_OK=false
            for ATTEMPT in 1 2 3; do
              echo "🔄 SUSFS pinned-commit fetch attempt $ATTEMPT/3..."
              rm -rf "$SUSFS_FOLDER"
              mkdir -p "$SUSFS_FOLDER"
              if git -C "$SUSFS_FOLDER" init -q . && \
                 git -C "$SUSFS_FOLDER" remote add origin "https://gitlab.com/simonpunk/susfs4ksu.git" && \
                 git -C "$SUSFS_FOLDER" fetch -q --depth 1 origin "$SUSFS_BRANCH" && \
                 git -C "$SUSFS_FOLDER" checkout -q FETCH_HEAD; then
                echo "✅ SUSFS pinned commit fetched: $SUSFS_BRANCH"
                PIN_OK=true
                break
              fi
              echo "⚠️ attempt $ATTEMPT/3 failed for pinned commit $SUSFS_BRANCH"
              sleep 5
            done
            if [ "$PIN_OK" != "true" ]; then
              echo "::error::Failed to fetch pinned SUSFS commit $SUSFS_BRANCH from GitLab. Check that the hash in config/config exists on simonpunk/susfs4ksu."
              exit 1
            fi
          else
          # 优先从本仓库 toolchain-cache 下载 SUSFS 归档（mirror 预缓存），
          # 避免全部矩阵 job 并发请求 GitLab 归档接口被限流；缓存缺失才回退 GitLab
          # 下载链：aria2c 多连接（快）→ curl 单连接（稳，规避 CDN 对多连接的间歇拒绝）→ GitLab
          SUSFS_CACHE_URL="https://github.com/${{ github.repository }}/releases/download/toolchain-cache/susfs-${SUSFS_BRANCH}.tar.gz"
          SUSFS_ARCHIVE="susfs_${SUSFS_BRANCH}.tar.gz"
          CACHE_OK=false
          for ATTEMPT in 1 2 3; do
            if aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=10 --allow-overwrite=true \
                 -d "/dev/shm" -o "$SUSFS_ARCHIVE" "$SUSFS_CACHE_URL"; then
              mkdir -p "$SUSFS_FOLDER"
              if tar -I "pigz -p $(nproc 2>/dev/null || echo 4) -b 256" -x --record-size=1M \
                   -f "/dev/shm/$SUSFS_ARCHIVE" -C "$SUSFS_FOLDER" --strip-components=1 --no-same-owner; then
                echo "✅ SUSFS synced from toolchain-cache (aria2c)"
                rm -f "/dev/shm/$SUSFS_ARCHIVE"
                CACHE_OK=true
                break
              fi
            fi
            echo "⚠️ toolchain-cache aria2c attempt $ATTEMPT/3 failed"
            rm -f "/dev/shm/$SUSFS_ARCHIVE" "$SUSFS_FOLDER" 2>/dev/null
            sleep 5
          done
          if [ "$CACHE_OK" != "true" ]; then
            for ATTEMPT in 1 2 3; do
              echo "🔄 curl single-connection attempt $ATTEMPT/3..."
              if curl -sL --fail --retry 3 --connect-timeout 30 --max-time 300 \
                   -o "/dev/shm/$SUSFS_ARCHIVE" "$SUSFS_CACHE_URL"; then
                mkdir -p "$SUSFS_FOLDER"
                if tar -I "pigz -p $(nproc 2>/dev/null || echo 4) -b 256" -x --record-size=1M \
                     -f "/dev/shm/$SUSFS_ARCHIVE" -C "$SUSFS_FOLDER" --strip-components=1 --no-same-owner; then
                  echo "✅ SUSFS synced from toolchain-cache (curl)"
                  rm -f "/dev/shm/$SUSFS_ARCHIVE"
                  CACHE_OK=true
                  break
                fi
              fi
              echo "⚠️ toolchain-cache curl attempt $ATTEMPT/3 failed"
              rm -f "/dev/shm/$SUSFS_ARCHIVE" "$SUSFS_FOLDER" 2>/dev/null
              sleep 5
            done
          fi
          if [ "$CACHE_OK" != "true" ]; then
            echo "::warning::toolchain-cache SUSFS fetch failed, falling back to GitLab"
            if ! retry_fetch_archive "https://gitlab.com/simonpunk/susfs4ksu.git" "$SUSFS_BRANCH"; then
              echo "::error::Failed to fetch SUSFS archive after multiple attempts"
              exit 1
            fi
          fi
          fi
          echo "SUSFS_COMMIT_SHA=$SUSFS_BRANCH" >> $GITHUB_ENV
          SUSFS_COMMIT_DATE=$(git -C "$SUSFS_FOLDER" log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S %z' 2>/dev/null || echo "unknown")
          echo "SUSFS_COMMIT_DATE=$SUSFS_COMMIT_DATE" >> $GITHUB_ENV
        fi
        echo "✅ Dependencies cloned"
        echo "::endgroup::"

    - name: Clean Up ABI Protected Exports
      shell: bash
      run: |
        echo "::group::Clean Up ABI Protected Exports"
        set -euo pipefail
        cd "$KERNEL_PLATFORM_FOLDER"
        rm -f common/android/abi_gki_protected_exports_* || true
        sed -i 's/protected_modules = \[.*\]/protected_modules = []/' common/modules.bzl || true
        echo "::endgroup::"

    - name: Add SukiSU
      shell: bash
      if: ${{ inputs.ksu_type == 'SukiSU' }}
      run: |
        set -euo pipefail
        echo "::group::Add SukiSU"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Adding SukiSU..."
        KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
        if [ -z "$KSU_INPUT" ]; then
          # builtin 分支：内置 SUSFS 支持
          KSU_INPUT="builtin"
        fi
        curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$KSU_INPUT"
        git submodule update --init --recursive || true

        # 内核侧（builtin 分支）KSU 版本来源：Makefile 以 REPO_BRANCH 指向分支的提交数
        # 计算 KSU_VERSION = 40000 + 提交数 - 2815（优先 GitHub API，回退本地 rev-list）。
        # 将 REPO_BRANCH 改写为官方最新上传 Manager 构建的提交，
        # 保证内核 KSU 版本与拉取的管理器安装包严格一致
        KSU_COMMIT="${{ inputs.ksu_commit }}"
        if [ -n "$KSU_COMMIT" ]; then
          if ! git -C KernelSU fetch origin "$KSU_COMMIT" 2>/dev/null; then
            echo "官方构建提交 $KSU_COMMIT 已存在于本地克隆，跳过 fetch"
          fi
          if ! git -C KernelSU cat-file -e "$KSU_COMMIT^{commit}" 2>/dev/null; then
            echo "::error::官方构建提交 $KSU_COMMIT 不在 KernelSU 仓库中，无法对齐版本来源"
            exit 1
          fi
          if ! sed -i -E "s|^(REPO_BRANCH[[:space:]]*[:?+]?=)[[:space:]]*main[[:space:]]*\$|\1 $KSU_COMMIT|" KernelSU/kernel/Makefile; then
            echo "::error::改写 KernelSU/kernel/Makefile 的 REPO_BRANCH 失败，无法对齐管理器版本"
            exit 1
          fi
          if ! grep -qE "^REPO_BRANCH[[:space:]]*[:?+]?=[[:space:]]*$KSU_COMMIT[[:space:]]*\$" KernelSU/kernel/Makefile; then
            echo "::error::未能在 KernelSU/kernel/Makefile 中对齐 REPO_BRANCH（上游 Makefile 结构可能已变化），无法对齐管理器版本"
            exit 1
          fi
          echo "SukiSU 内核侧版本来源已对齐官方上传构建提交 $KSU_COMMIT (KSU 版本 $((40000 + $(git -C KernelSU rev-list --count "$KSU_COMMIT") - 2815)))"
        fi

        # SukiSU 版本名默认带 @分支名 后缀，改写为品牌标识
        if [ -f "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" ]; then
          bash "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" "$KSU_FOLDER" sukisu
          echo "✅ SukiSU 版本标识已注入 @LingLuo"
        fi

        # ── Kernel-tree API compatibility for SukiSU (auto-detected, all kernel versions) ──
        # Newer BSP kernel trees (sm8845/sm8850/mt6789/mt6993, android16-6.12.38+) diverged
        # from what the builtin branch expects and fail to compile without these fixes:
        # 1) struct netlink_kernel_cfg lost its `cb_mutex` member -> the dynamic member
        #    table in kpm/super_access.c references a non-existent member (compile error).
        # 2) security_add_hooks() takes a `const struct lsm_id *lsmid` instead of a
        #    `const char *`; the struct lsm_id string field is named `name` or `lsm`
        #    depending on the tree, so the field is detected at build time.
        # 3) KERNEL_SU_UAPI_VERSION on the builtin branch can lag the manager built
        #    from main; the dynamic sync below closes the gap whenever it reopens.
        # （2026-10-24 清理：pkg_observer track_throne 标志 / selinux 跳板 /
        #   manager ioctl 三项一次性兼容已随 SukiSU builtin ce75122b
        #   （2026-10-21 同步官方 KernelSU）上游修复而移除：pkg_observer 回归
        #   track_throne(false)，selinux_hide 改为静态函数指针，动态管理器
        #   ioctl 重构。KSU_KERNEL_DIR 兼容已恢复（见下方第 4 项）：builtin
        #   的 ifeq filter 只拦绝对路径，拦不住 6.12 OP 树相对的
        #   "../drivers/kernelsu"，上游并未真正修复。）
        NETLINK_H="$COMMON_KERNEL_FOLDER/include/linux/netlink.h"
        if [ -f "$NETLINK_H" ] && ! grep -q "cb_mutex" "$NETLINK_H"; then
          # builtin 新布局把 kpm 从 kernel/kpm 挪到 kernel/extension/kpm；只认旧路径会让
          # 这段兼容静默失效（6.12 全部在 super_access.c 编译失败）。两种路径都扫。
          KPM_PATCHED=0
          while IFS= read -r SU_SUPER; do
            [ -n "$SU_SUPER" ] || continue
            if grep -q "DEFINE_MEMBER(netlink_kernel_cfg, cb_mutex)" "$SU_SUPER"; then
              sed -i '/DEFINE_MEMBER(netlink_kernel_cfg, cb_mutex)/d' "$SU_SUPER"
              echo "🔧 compat: dropped DEFINE_MEMBER(netlink_kernel_cfg, cb_mutex) in ${SU_SUPER#"$KSU_FOLDER"/} (member removed in this kernel tree)"
              KPM_PATCHED=$((KPM_PATCHED + 1))
            fi
          done <<< "$(find "$KSU_FOLDER/kernel" -maxdepth 3 -type f -path '*/kpm/super_access.c' 2>/dev/null)"
          echo "🔧 compat: netlink_kernel_cfg.cb_mutex fixups applied: $KPM_PATCHED"
        fi

        LSM_HOOKS_H="$COMMON_KERNEL_FOLDER/include/linux/lsm_hooks.h"
        SU_LSM="$KSU_FOLDER/kernel/hook/lsm_hook.c"
        if [ -f "$LSM_HOOKS_H" ] && [ -f "$SU_LSM" ]; then
          if grep -q "const struct lsm_id \*lsmid" "$LSM_HOOKS_H" && grep -q 'security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu")' "$SU_LSM"; then
            LSM_FIELD="$(sed -n '/struct lsm_id {/,/};/p' "$LSM_HOOKS_H" | grep -oE 'const char[[:space:]]+\*[a-z_]+' | head -n1 | sed -E 's/const char[[:space:]]+\*//')"
            LSM_FIELD="${LSM_FIELD:-name}"
            sed -i 's|security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");|{ static const struct lsm_id ksu_lsm_id = { .'"$LSM_FIELD"' = "ksu", .id = 0 }; security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), \&ksu_lsm_id); }|' "$SU_LSM"
            echo "🔧 compat: security_add_hooks migrated to the const struct lsm_id * API (field: $LSM_FIELD)"
          fi
        fi

        # 3) Dynamic UAPI sync (scripts/susfs_compat/sync_uapi.sh): 对齐官方
        #    main 分支管理器的 UAPI。builtin 现为 6（与 main 持平），本步当前
        #    为无操作；脚本内容自适应且幂等，main 未来升 7/8 而 builtin 滞后时
        #    自动补齐缺失常量/标志/ioctl 并抬升 KERNEL_SU_UAPI_VERSION（含
        #    infra/symbol_resolver 内核侧接线）。
        if [ -f "$GITHUB_WORKSPACE/scripts/susfs_compat/sync_uapi.sh" ]; then
          bash "$GITHUB_WORKSPACE/scripts/susfs_compat/sync_uapi.sh" "$KSU_FOLDER"
        fi

        # 4) 6.12 GKI 树（canoe/mt6789/mt6993 等）以 O=out 构建：make -C out 时
        #    kbuild 给 drivers/kernelsu 的 $(src) 是 "../drivers/kernelsu"（相对），
        #    builtin Makefile 的 "KSU_KERNEL_DIR := $(srctree)/$(src)"（其 ifeq
        #    filter 只拦绝对路径）再拼一层相对 $(srctree) 得到
        #    "../../drivers/kernelsu"，preinit runner 规则在 make 规则求值阶段即报
        #      No rule to make target '../../drivers/kernelsu/preinit/runner/runner.c'
        #    改为 $(wildcard) 自校验拼接：拼出的路径看得到 runner.c 才用它，
        #    否则退回 $(src)；≤6.6 树取值与原来一致（FinaSU 同款修法）。
        SU_KB="$KSU_FOLDER/kernel/Makefile"
        if [ -f "$SU_KB" ] && grep -qF 'KSU_KERNEL_DIR := $(srctree)/$(src)' "$SU_KB"; then
          sed -i 's|^KSU_KERNEL_DIR := \$(srctree)/\$(src)$|KSU_KERNEL_DIR := $(if $(wildcard $(srctree)/$(src)/preinit/runner/runner.c),$(srctree)/$(src),$(src))|' "$SU_KB"
          grep -qF 'KSU_KERNEL_DIR := $(if $(wildcard $(srctree)/$(src)/preinit/runner/runner.c),$(srctree)/$(src),$(src))' "$SU_KB" \
            || { echo "::error::SukiSU Makefile KSU_KERNEL_DIR 重写失败（上游结构可能已变化）"; exit 1; }
          echo "🔧 compat: SukiSU KSU_KERNEL_DIR wildcard-guarded against 6.12 relative \$(src)"
        fi

        cd KernelSU/kernel

        # SukiSU Kbuild 自动计算版本 (40000 + REPO_BRANCH 指向分支的提交数 - 2815)
        KSU_COMMIT_SHA=$(git rev-parse HEAD)
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> $GITHUB_ENV
        echo "KSU_COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S %z' 2>/dev/null || echo unknown)" >> $GITHUB_ENV

        # 计算 KSUVER 用于 ZIP 命名（与 Kbuild 同源：已对齐时用官方构建提交的提交数，
        # 否则回退 GitHub API main 分支提交数）
        if [ -n "${KSU_COMMIT:-}" ]; then
          COMMITS=$(git rev-list --count "$KSU_COMMIT")
        else
          COMMITS=$(curl -sI -H "Authorization: Bearer ${{ inputs.github_token }}" \
            "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/commits?sha=main&per_page=1" \
            | grep -i '^link:' | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p' || true)
          if [ -z "$COMMITS" ]; then
            COMMITS=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          fi
        fi
        KSU_VERSION=$(expr 40000 + ${COMMITS:-0} - 2815)
        
        
        cd ..
        
        echo "Add SukiSU Configuration Settings"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU=y
        EOF
        
        echo "SukiSU" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$KSU_VERSION" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
        echo "SukiSU Version: $KSU_VERSION"
        echo "✅ SukiSU added (branch/commit: $KSU_INPUT, sha: ${KSU_COMMIT_SHA:0:8})"
        echo "::endgroup::"

    - name: Add BakaSU
      shell: bash
      if: ${{ inputs.ksu_type == 'BakaSU' }}
      run: |
        set -euo pipefail
        echo "::group::Add BakaSU"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Adding BakaSU..."
        KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
        if [ -z "$KSU_INPUT" ]; then
          KSU_INPUT="main"
        fi
        curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s "$KSU_INPUT"
        git submodule update --init --recursive || true

        # 内核侧 KernelSU 检出到官方最新上传 Manager 构建的同一提交
        #（Kbuild 以 30700 + git 提交数 计算版本，与官方管理器 versionCode 同源同值），
        # 保证内核 KSU 版本与拉取的管理器安装包严格一致
        KSU_COMMIT="${{ inputs.ksu_commit }}"
        if [ -n "$KSU_COMMIT" ]; then
          if ! git -C KernelSU checkout --detach "$KSU_COMMIT" 2>/dev/null; then
            git -C KernelSU fetch origin "$KSU_COMMIT"
            git -C KernelSU checkout --detach "$KSU_COMMIT"
          fi
          if [ "$(git -C KernelSU rev-parse HEAD)" != "$KSU_COMMIT" ]; then
            echo "::error::KernelSU 检出官方构建提交 $KSU_COMMIT 失败，无法对齐管理器版本"
            exit 1
          fi
          echo "KernelSU 已检出到官方上传构建提交 $KSU_COMMIT"
        fi

        # BakaSU 的 REPO_NAME 决定版本名品牌后缀，改写为品牌标识
        if [ -f "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" ]; then
          bash "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" "$KSU_FOLDER" bakasu
          echo "✅ BakaSU 版本标识已注入 @LingLuo"
        fi
        cd KernelSU/kernel

        # BakaSU Kbuild 以 30000 + 提交数 + 700 自动计算版本，无需 sed
        KSU_COMMIT_SHA=$(git rev-parse HEAD)
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> $GITHUB_ENV
        echo "KSU_COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S %z' 2>/dev/null || echo unknown)" >> $GITHUB_ENV
        
        COMMITS=$(/usr/bin/git rev-list --count HEAD)
        KSU_VERSION=$(expr 30000 + $COMMITS + 700)
        
        
        cd ..
        
        echo "Add BakaSU Configuration Settings"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU=y
        CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@%REPO_NAME%"
        EOF
        
        echo "BakaSU" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$KSU_VERSION" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
        echo "BakaSU Version: $KSU_VERSION"
        echo "✅ BakaSU added (branch/commit: $KSU_INPUT, sha: ${KSU_COMMIT_SHA:0:8})"
        echo "::endgroup::"

    - name: Add FinaSU
      shell: bash
      if: ${{ inputs.ksu_type == 'FinaSU' }}
      env:
        KSU_CERT_SIZE: ${{ inputs.ksu_cert_size }}
        KSU_CERT_HASH: ${{ inputs.ksu_cert_hash }}
      run: |
        set -euo pipefail
        echo "::group::Add FinaSU"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Adding FinaSU..."
        git clone https://github.com/LyraVoid/FinaSU.git KernelSU
        git submodule update --init --recursive || true

        KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
        if [ -n "$KSU_INPUT" ]; then
          if ! git -C KernelSU checkout --detach "$KSU_INPUT" 2>/dev/null; then
            git -C KernelSU fetch origin "$KSU_INPUT"
            git -C KernelSU checkout --detach "$KSU_INPUT"
          fi
        fi

        # 内核侧检出到官方最新上传 Manager 构建的同一提交
        #（Kbuild 以 30000 + git 提交数 计算版本，与官方管理器 versionCode 同源同值），
        # 保证内核 KSU 版本与拉取的管理器安装包严格一致
        KSU_COMMIT="${{ inputs.ksu_commit }}"
        if [ -n "$KSU_COMMIT" ]; then
          if ! git -C KernelSU checkout --detach "$KSU_COMMIT" 2>/dev/null; then
            git -C KernelSU fetch origin "$KSU_COMMIT"
            git -C KernelSU checkout --detach "$KSU_COMMIT"
          fi
          if [ "$(git -C KernelSU rev-parse HEAD)" != "$KSU_COMMIT" ]; then
            echo "::error::KernelSU 检出官方构建提交 $KSU_COMMIT 失败，无法对齐管理器版本"
            exit 1
          fi
          echo "KernelSU 已检出到官方上传构建提交 $KSU_COMMIT (KSU 版本 $((30000 + $(git -C KernelSU rev-list --count HEAD))))"
        fi

        # FinaSU 自带的 kernel/setup.sh 仍克隆上游 tiann/KernelSU，此处手动完成
        # in-tree 集成：软链驱动目录并挂载 Makefile / Kconfig
        DRIVER_DIR="$COMMON_KERNEL_FOLDER/drivers"
        ln -sfn "$(realpath --relative-to="$DRIVER_DIR" "$KERNEL_PLATFORM_FOLDER/KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
        # FinaSU 把 UAPI 头文件放在仓库根目录 uapi/，内核源码里按 "uapi/xxx.h" 引用
        # （allowlist.h / dispatch.c / dynamic_manager.c 等）。in-tree 集成只软链了
        # KernelSU/kernel，drivers/kernelsu/uapi 不存在 → 编译报
        # "fatal error: 'uapi/app_profile.h' file not found"。
        # 在 kernel/ 下补一个指向仓库 uapi/ 的相对软链，让 -I$(KSU_KERNEL_DIR)
        # 能解析这些引用；老版本树没有根 uapi/ 时自动跳过。
        if [ -d KernelSU/uapi ] && [ ! -e KernelSU/kernel/uapi ]; then
          ln -s ../uapi KernelSU/kernel/uapi
          echo "Linked KernelSU/uapi -> KernelSU/kernel/uapi for in-tree build"
        fi
        # 6.12 树上 drivers/kernelsu/include 的 -I 未生效（klog.h / arch.h / util.h
        # 走 "klog.h" 形式引用会 fatal error not found），而 -I$(KSU_KERNEL_DIR)
        # 本身是可用的。把 include/ 下的头文件在驱动根目录补一层同名软链，
        # 让两种引用形式都能落到同一份头文件上；已存在同名文件时不动。
        for h in KernelSU/kernel/include/*.h; do
          [ -e "$h" ] || continue
          hbase="$(basename "$h")"
          [ -e "KernelSU/kernel/$hbase" ] || ln -s "include/$hbase" "KernelSU/kernel/$hbase"
        done
        echo "KernelSU headers: $(ls KernelSU/kernel/include/*.h 2>/dev/null | wc -l) in include/, klog.h root link: $(readlink KernelSU/kernel/klog.h 2>/dev/null || echo none)"
        # 先补一个空行再追加：部分 vendor 树（如 mt6835 n6x）的 drivers/Makefile
        # 末行没有换行符，直接 append 会把 kernelsu 条目拼进上一行而被静默丢弃
        grep -q "obj-.*CONFIG_KSU.*kernelsu/" "$DRIVER_DIR/Makefile" || \
          { echo "" >> "$DRIVER_DIR/Makefile"; echo 'obj-$(CONFIG_KSU) += kernelsu/' >> "$DRIVER_DIR/Makefile"; }
        if ! grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"; then
          sed -i "/endmenu/i source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"
        fi
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU=y
        EOF

        # 将 FinaSU 官方管理器签名证书注入内核第二信任槽（EXPECTED_SIZE2/HASH2）。
        # 不注入时内核仅信任上游 KernelSU 默认槽，官方 KernelSU 管理器会抢占
        # manager 身份，FinaSU 管理器显示"未安装"。
        if [ -z "$KSU_CERT_SIZE" ] || [ -z "$KSU_CERT_HASH" ]; then
          echo "管理器证书未由 get-manager 传入，回退到 FinaSU 最新 Release APK 提取..."
          REL_APK=$(mktemp -d)/manager.apk
          REL_JSON=""
          for ATTEMPT in 1 2 3; do
            REL_JSON=$(curl -s --fail --max-time 30 \
              "https://api.github.com/repos/LyraVoid/FinaSU/releases/latest") \
              && [ -n "$REL_JSON" ] && break
            echo "获取 Release 信息失败，重试 ($ATTEMPT/3)..."
            sleep 5
          done
          REL_URL=$(printf '%s' "$REL_JSON" | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d.get('assets',[]) if a['name'].endswith('.apk')))" 2>/dev/null || true)
          if [ -z "$REL_URL" ]; then
            echo "::error::无法获取 FinaSU 管理器签名证书：get-manager 未传入且最新 Release 中没有 APK 资产"
            exit 1
          fi
          curl -sL --fail --retry 3 --max-time 300 -o "$REL_APK" "$REL_URL" || {
            echo "::error::下载 FinaSU Release APK 失败，无法提取管理器签名证书"
            exit 1
          }
          CERT_INFO=$(python3 "$GITHUB_WORKSPACE/scripts/finasu_compat/extract_manager_cert.py" "$REL_APK" | head -n1)
          KSU_CERT_SIZE=$(echo "$CERT_INFO" | awk '{print $1}')
          KSU_CERT_HASH=$(echo "$CERT_INFO" | awk '{print $2}')
        fi
        if [ -z "$KSU_CERT_SIZE" ] || [ -z "$KSU_CERT_HASH" ]; then
          echo "::error::FinaSU 管理器签名证书提取失败，FinaSU 管理器将无法被内核识别"
          exit 1
        fi
        echo "注入 FinaSU 管理器签名证书到内核第二信任槽: size=$KSU_CERT_SIZE sha256=$KSU_CERT_HASH"
        awk -v size="$KSU_CERT_SIZE" -v hash="$KSU_CERT_HASH" '
          !done && /^ccflags-y \+= -DEXPECTED_HASH=/ {
            print
            print "# injected by OnePlus_KernelSU_SUSFS: trust the official FinaSU manager via the second signature slot"
            print "KSU_EXPECTED_SIZE2 := " size
            print "KSU_EXPECTED_HASH2 := " hash
            print "KSU_SECOND_SIGNATURE_RELEASE := 1"
            done = 1
            next
          }
          { print }
        ' KernelSU/kernel/Kbuild > KernelSU/kernel/Kbuild.new && mv KernelSU/kernel/Kbuild.new KernelSU/kernel/Kbuild
        grep -q "^KSU_EXPECTED_SIZE2 := " KernelSU/kernel/Kbuild \
          && grep -q "^KSU_EXPECTED_HASH2 := " KernelSU/kernel/Kbuild \
          && grep -q "^KSU_SECOND_SIGNATURE_RELEASE := 1" KernelSU/kernel/Kbuild \
          || { echo "::error::Kbuild 注入失败（锚点行缺失，FinaSU 上游 Kbuild 结构可能已变化）"; exit 1; }

        # 6.12 GKI 树（canoe/mt6789/mt6993 等）以 O=out 构建：make -C out 时
        # kbuild 给 drivers/kernelsu 的 $(src) 是 "../drivers/kernelsu"（相对），
        # FinaSU Kbuild 的 "KSU_KERNEL_DIR := $(srctree)/$(src)"（其 ifeq filter
        # 只拦绝对路径）再拼一层相对 $(srctree) 得到 "../../drivers/kernelsu"，
        # preinit runner 规则在 make 规则求值阶段即报
        #   No rule to make target '../../drivers/kernelsu/preinit/runner/runner.c'
        # （此前两步法补丁强制 KSU_NO_PREINIT 关掉 preinit 故未暴露；切到内置
        # SUSFS 保留 kprobe preinit 后必现）。改为 $(wildcard) 自校验拼接
        # （SukiSU builtin 同款手法）：拼出的路径看得到 runner.c 才用它，否则
        # 退回 $(src)；≤6.6 树 $(src) 相对 + $(srctree) 绝对，取值与原来一致。
        FINA_KB="$KSU_FOLDER/kernel/Kbuild"
        if [ -f "$FINA_KB" ] && grep -qF 'KSU_KERNEL_DIR := $(srctree)/$(src)' "$FINA_KB"; then
          sed -i 's|^KSU_KERNEL_DIR := \$(srctree)/\$(src)$|KSU_KERNEL_DIR := $(if $(wildcard $(srctree)/$(src)/preinit/runner/runner.c),$(srctree)/$(src),$(src))|' "$FINA_KB"
          grep -qF 'KSU_KERNEL_DIR := $(if $(wildcard $(srctree)/$(src)/preinit/runner/runner.c),$(srctree)/$(src),$(src))' "$FINA_KB" \
            || { echo "::error::FinaSU Kbuild KSU_KERNEL_DIR 重写失败（上游 Kbuild 结构可能已变化）"; exit 1; }
          echo "🔧 compat: FinaSU KSU_KERNEL_DIR wildcard-guarded against 6.12 relative \$(src)"
        fi

        # 内核完整版本号（KSU_VERSION_FULL，形如 v<tag>-<sha>@<branch>）分支段校准：
        # 工作流以 --detach 检出（master / 管理器对齐提交），rev-parse --abbrev-ref
        # 返回 "HEAD"，管理器「内核完整版本」显示 v1.0.x-xxxx@HEAD。
        # 与 SukiSU/BakaSU 一致替换为品牌名 @LingLuo（ksu_post_setup.sh finasu 模式）
        bash "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" "$KSU_FOLDER" finasu
        grep -qF 'KSU_VERSION_FULL := v$(if $(KSU_VERSION_TAG),$(KSU_VERSION_TAG),unknown)-$(KSU_VERSION_SHA)@LingLuo' KernelSU/kernel/Kbuild \
          || { echo "::error::FinaSU 内核完整版本号分支段替换失败（上游 Kbuild 版本行可能已变化）"; exit 1; }

        KSU_COMMIT_SHA=$(git -C KernelSU rev-parse HEAD)
        COMMITS=$(git -C KernelSU rev-list --count HEAD)
        KSU_VERSION=$(expr 30000 + $COMMITS)
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> $GITHUB_ENV
        echo "KSU_COMMIT_DATE=$(git -C KernelSU log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S %z' 2>/dev/null || echo unknown)" >> $GITHUB_ENV
        echo "FinaSU" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$KSU_VERSION" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
        echo "FinaSU Version: $KSU_VERSION"
        echo "✅ FinaSU added (branch/commit: ${KSU_INPUT:-master}, sha: ${KSU_COMMIT_SHA:0:8})"
        echo "::endgroup::"

    - name: Apply SUSFS Patches
      shell: bash
      if: ${{ env.OP_SUSFS == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply SUSFS patches"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Applying SUSFS patches..."
        cp "$SUSFS_FOLDER/kernel_patches/fs/"* "$COMMON_KERNEL_FOLDER/fs/"
        cp "$SUSFS_FOLDER/kernel_patches/include/linux/"* "$COMMON_KERNEL_FOLDER/include/linux/"
        
        susfs_version=$(grep '#define SUSFS_VERSION' "$COMMON_KERNEL_FOLDER/include/linux/susfs.h" | awk -F'"' '{print $2}')
        echo "SUSVER=$susfs_version" >> $GITHUB_ENV
        echo "$susfs_version" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "SusFS Version: $susfs_version"
        
        if [ "${{ inputs.ksu_type }}" == "FinaSU" ]; then
          # FinaSU 5b83330b（2026-10-23 合入 master）起自带内核侧 SUSFS 集成：
          # kernel/Kconfig 的 KSU_SUSFS 菜单、kernel/extension/susfs.c 提供的
          # 内核侧补丁兼容入口点（ksu_handle_* / my_* / fake_status 符号）以及
          # Kbuild 的 kernelsu-$(CONFIG_KSU_SUSFS)（见 FinaSU
          # docs/builtin-integration.md）。上游明确要求驱动树不再套用
          # 10_enable_susfs_for_ksu.patch —— 多数 hunk 已内置、钩子模型不同，
          # 强套必然 reject（master 重构后 Kconfig/adb_root.c/sucompat.h/
          # setuid_hook.h/selinux/* 七处漂移）。与 SukiSU/BakaSU 同路子：
          # defconfig 打开 CONFIG_KSU_SUSFS 即可（下方统一片段已含）。
          # 按检出内容检测；master / 管理器对齐提交均含内置集成，
          # 检测不到即固定到了过老提交，显式报错而不是静默丢掉 SUSFS。
          if [ -f "$KSU_FOLDER/kernel/extension/susfs.c" ] && \
             grep -q '^config KSU_SUSFS' "$KSU_FOLDER/kernel/Kconfig"; then
            echo "FinaSU built-in SUSFS integration detected (kernel/extension/susfs.c), skipping KSU-tree SUSFS patch"
            # 防回归校验（FinaSU scripts/check-susfs-upstream.sh 的等价检查）：
            # 内核侧 50 号补丁引用的 KSU 侧符号必须全部由 FinaSU 内置实现提供，
            # 缺失即 vmlinux 链接失败（undefined symbol），在此提前显式报错。
            KERNEL_SIDE_PATCH="$SUSFS_FOLDER/kernel_patches/50_add_susfs_in_${SUSFS_KERNEL_BRANCH}.patch"
            [ -f "$KERNEL_SIDE_PATCH" ] || { echo "::error::内核侧 SUSFS 补丁不存在: $KERNEL_SIDE_PATCH"; exit 1; }
            missing_sym=0
            for sym in $(grep -oE '\b(ksu|my)_[A-Za-z0-9_]+|\bfake_status\b|\binitialize_fake_status\b' \
                           "$KERNEL_SIDE_PATCH" | sort -u); do
              if ! grep -RqsF --include='*.c' --include='*.h' -- "$sym" "$KSU_FOLDER/kernel"; then
                echo "::error::FinaSU 内置 SUSFS 实现缺少内核侧补丁引用的符号: $sym"
                missing_sym=1
              fi
            done
            [ "$missing_sym" -eq 0 ] || exit 1
            echo "FinaSU built-in SUSFS symbol check passed"
          else
            echo "::error::FinaSU 检出缺少内置 SUSFS 集成（kernel/extension/susfs.c / KSU_SUSFS Kconfig 不存在）。"
            echo "::error::FinaSU 5b83330b（2026-10-23）起自带 SUSFS 集成，旧的 10_enable + 漂移补丁两步法已随上游重构废弃删除。"
            echo "::error::请固定到 5b83330b 或之后的提交（master / 官方管理器对齐提交均满足），或关闭 SUSFS。"
            exit 1
          fi
        else
          # SukiSU (builtin) / BakaSU (main) 内核代码已内置 SUSFS 集成 (config KSU_SUSFS)，
          # 无需再对 KSU 树打 10_enable_susfs_for_ksu.patch，仅保留内核侧 SUSFS 补丁。
          echo "SukiSU/BakaSU 使用内置 SUSFS 支持，跳过 KSU 树 SUSFS 补丁"
        fi
        
        cd "$COMMON_KERNEL_FOLDER"
        if [ "${{ env.ANDROID_VER }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
          if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
            sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
          fi
          if ! grep -qxF 'extern void __fold_filemap_fixup_entry(struct vma_iterator *iter, unsigned long *end);' ./include/linux/page_size_compat.h; then
            patch -p1 < "$KERNEL_PATCHES_FOLDER/common/backports/fold_fixup_entries.patch"
          fi
        fi
        
        # Fake kernel patch to fix failures
        fake_patched=0
        fake_patched_expand=0
        if [ "${{ env.ANDROID_VER }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
          if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
            echo "nr_subpages Line not found. Fake Patching!"
            sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
            fake_patched=1
          fi
          
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi
          
          if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
            echo "#include <linux/zswap.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/sched\/sysctl.h>/a #include <linux\/zswap.h>' ./mm/memory.c
          fi
          
          if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
            echo "Temporarily expand the last_vma_end if block to fix a matching issue."
            perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
            fake_patched_expand=1
          fi
        fi
        if [ "${{ env.ANDROID_VER }}" = "android12" ] && [ "${{ env.KERNEL_VER }}" = "5.10" ]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi
        fi
        if [ "${{ env.ANDROID_VER }}" = "android13" ] && [ "${{ env.KERNEL_VER }}" = "5.15" ]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi
          
          if grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
            echo "#include swap_slots.h> Line found. Deleting header."
            sed -i '/#include <linux\/swap_slots.h>/d' ./mm/memory.c
            fake_patched=1
          fi
        fi
        
        if [ "${{ env.ANDROID_VER }}" = "android14" ] && [ "${{ env.KERNEL_VER }}" = "6.1" ]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi
          
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi
        fi
        
        # 内核侧 SUSFS 主补丁统一走 compat 应用器：
        #   5.15 厂商分支删掉了 susfs 补丁 hunk 依赖的 vendor hook 头文件
        #   （fs/namespace.c 的 trace/hooks/blk.h、fs/proc/task_mmu.c 的
        #   trace/hooks/mm.h），整块 hunk 会被 patch 丢弃 —— 连带 namespace.c
        #   的 CL_COPY_MNT_NS 定义一起丢，编译必失败；6.12 的 fs/exec.c 少了
        #   dma-buf.h，show_smap/show_smaps_rollup 也被 page-size-migration
        #   重构，3 个 hunk 无法定位。脚本负责上下文垫片、hunk 重适配和
        #   结果校验，任何未修复的冲突都会显式报错而不是静默产出坏内核。
        bash "$GITHUB_WORKSPACE/scripts/susfs_compat/apply_kernel_susfs_patch.sh" \
          "$COMMON_KERNEL_FOLDER" \
          "$SUSFS_FOLDER/kernel_patches/50_add_susfs_in_${{ env.SUSFS_KERNEL_BRANCH }}.patch"
        
        # SUSFS's OPEN_REDIRECT code unconditionally calls VMA_PAD_START(), which
        # only exists on GKI branches that carry Google's page-size-migration
        # feature (added to each android version's kernel/common branch at a
        # different, sometime later, os_patch_level). Older os_patch_levels in
        # our build matrix predate it, so fall back to a no-padding definition
        # when the real header/macro isn't present. This is version-agnostic and
        # a no-op wherever the real header already provides it.
        if grep -q 'VMA_PAD_START(' ./fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' ./fs/proc/task_mmu.c; then
          sed -i '\|#include "internal.h"|a\\n#undef VMA_PAD_START\n#ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
          echo "Added VMA_PAD_START fallback definition to fs/proc/task_mmu.c"
        fi

        # 把 SUSFS 的 SELinux 集成切换到新 selinux_hide 模型（BakaSU 同步
        # tiann 上游新模型后已删除 fake_state 定义）：<6.6 的 &fake_state
        # 调用切换为 backup_sepolicy + 8 参 security_context_to_sid_with_policy，
        # >=6.6 的 6 参调用/声明归一化为 8 参（新模型签名）。脚本按 KernelSU
        # 实际形态自动跳过旧模型检出；幂等。FinaSU 内置 SUSFS 集成自带新版
        # selinux_hide（CONFIG_KSU_SUSFS 下导出 my_* 符号），跳过。
        if [ "${{ inputs.ksu_type }}" != "FinaSU" ] && [ -f "$GITHUB_WORKSPACE/scripts/susfs_compat/apply_selinux_new_model.sh" ]; then
          bash "$GITHUB_WORKSPACE/scripts/susfs_compat/apply_selinux_new_model.sh" "$KSU_FOLDER"
        fi

        # Revert Fake kernel patch
        if [ "$fake_patched_expand" = 1 ]; then
          if [ "${{ env.ANDROID_VER }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
            if grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
              perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\) \{\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t\}/\t\t\tif (vma->vm_end > last_vma_end)\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);/' ./fs/proc/task_mmu.c
            fi
          fi
        fi
        
        if [ "$fake_patched" = 1 ]; then
          if [ "${{ env.ANDROID_VER }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
            if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
              echo "nr_subpages Line found. Revert Fake Patching!"
              sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
            fi
          fi
          if [ "${{ env.ANDROID_VER }}" = "android12" ] && [ "${{ env.KERNEL_VER }}" = "5.10" ]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
          fi
          if [ "${{ env.ANDROID_VER }}" = "android13" ] && [ "${{ env.KERNEL_VER }}" = "5.15" ]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
            
            if ! grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
              echo "#include <linux/swap_slots.h> Line not found. Adding missing header"
              sed -i '/#include <linux\/vmalloc.h>/a #include <linux\/swap_slots.h>' ./mm/memory.c
            fi
          fi
          if [ "${{ env.ANDROID_VER }}" = "android14" ] && [ "${{ env.KERNEL_VER }}" = "6.1" ]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
          fi
        fi
        echo "✅ SUSFS patches applied"
        
        echo "Add SUSFS Configuration Settings"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        CONFIG_KSU_SUSFS_SUS_SU=n
        EOF
        
        echo "::endgroup::"

    - name: Add BBG
      if: ${{ env.OP_BBG == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add BBG LSM"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Adding BBG..."
        if ! wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash -s main; then
          echo "::warning::BBG setup script failed, continuing anyway"
        fi
        echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig
        
        case "$OP_BRANCH" in
          wild/sm8850|wild/sm8845)
            echo "Applying BBG efisp abl whitelist patch"
            patch -p1 < "$KERNEL_PATCHES_FOLDER/common/bbg/0001-Enable-abl-and-efisp-flashing-for-efisp-exploit-devices.patch"
          ;;
        esac
        
        echo "✅ BBG LSM added"
        echo "::endgroup::"

    - name: Apply Other Patches
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply Other patches"
        cd "$COMMON_KERNEL_FOLDER"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          echo "Patching ptrace!"
          patch -p1 -F 3 < "$KERNEL_PATCHES_FOLDER/gki_ptrace.patch"
        else
          echo "Kernel >= $MIN_VERSION, skipping ptrace patch"
        fi
        
        if [ "$OP_HMBIRD" = true ]; then
          echo "Patching hmbird!"
          HMBIRD_MODEL=$(echo "$OP_MODEL" | sed 's/-[0-9]\+\.[0-9]\+\.[0-9]\+$//')
          case "$OP_MODEL" in
            OP-ACE-5-ULTRA-6.6.50|OP-ACE-5-PRO-6.6.30|OP13-6.6.30|OP13-CPH-6.6.56|OP13T-6.6.89|OP13-6.6.89|OP-ACE-5-PRO-6.6.89|OP-PAD-2-PRO-6.6.89|OP-PAD-3-SM8750-6.6.89|OP-ACE-6-6.6.89)
              FENGCHI_DIR="$KERNEL_PATCHES_FOLDER/oneplus/hmbird/deprecated" ;;
            *)
              FENGCHI_DIR="$KERNEL_PATCHES_FOLDER/oneplus/hmbird" ;;
          esac
          dos2unix "$FENGCHI_DIR/fengchi_${HMBIRD_MODEL}_${OP_OS_VERSION}.patch"
          # 6.6.89 等较新的一加源码在 task_struct 多插了一个 dmabuf_info KABI 槽，
          # fengchi 补丁里 sched.h 的 hunk 上下文随之失配：hunk 被丢弃生成 .rej，
          # set -e 让本步骤在编译前就退出（编译尝试次数 0）。这里按实际布局重写
          # 该 hunk，保留厂商的 dmabuf_info 槽；布局一致的机型自动跳过。
          bash "$GITHUB_WORKSPACE/scripts/oneplus_compat/fix_hmbird_patch_drift.sh" \
            "$COMMON_KERNEL_FOLDER" \
            "$FENGCHI_DIR/fengchi_${HMBIRD_MODEL}_${OP_OS_VERSION}.patch"
          patch -p1 -F 3 < "$FENGCHI_DIR/fengchi_${HMBIRD_MODEL}_${OP_OS_VERSION}.patch"
          dos2unix "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/overwriter.patch"
          patch -p1 -F 3 < "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/overwriter.patch"
          chmod +x ./drivers/of/overwriter/overwrite_configs/convert_configs.sh
          dos2unix "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/hmbird_config.patch"
          patch -p1 -F 3 < "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/hmbird_config.patch"
        else
          echo "Hmbird not enabled, skipping fengchi patch"
        fi

        echo "Patching module intercept and overlay mechanism"
        patch -p1 < "$KERNEL_PATCHES_FOLDER/oneplus/module_overlay/0001-module-Add-module-intercept-and-overlay-mechanism-$ANDROID_VER-$KERNEL_VER.patch"
        if [ -d "$COMMON_KERNEL_FOLDER/kernel/module/module_overlay/" ]; then
          chmod +x ./kernel/module/module_overlay/convert_overlay.sh
        elif [ -d "$COMMON_KERNEL_FOLDER/kernel/module_overlay/" ]; then
          chmod +x ./kernel/module_overlay/convert_overlay.sh
        fi

        copied_modules=""
        SOC="${OP_BRANCH#*/}"

        declare -A selected_file=()
        declare -A selected_priority=()
        selected_count=0
        
        # Define suffixes in order of priority (1 to 7)
        suffixes=(
          "_${OP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.ko"
          "_${SOC}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.ko"
          "_${OP_MODEL}_${OP_OS_VERSION}.ko"
          "_${SOC}_${OP_OS_VERSION}.ko"
          "_${OP_MODEL}.ko"
          "_${SOC}.ko"
          "_${KERNEL_FULL_VER}.ko"
        )

        while IFS= read -r -d '' file; do
          filename="${file##*/}"
          module_name=""
          priority=0
          
          exact_module_name=$(modinfo -F name "$file" 2>/dev/null)

          # Evaluate priorities by iterating through the ordered suffixes
          for i in "${!suffixes[@]}"; do
            suffix="${suffixes[$i]}"
            if [[ "$filename" == *"$suffix" ]]; then
              extracted_name="${filename%"$suffix"}"
              extracted_normalized="${extracted_name//-/_}"

              if [[ "$extracted_normalized" == "$exact_module_name" ]]; then
                module_name="$extracted_name"
                priority=$((i + 1))
              fi
              
              break # Match found, stop checking lower priorities
            fi
          done
          
          # File did not match any supported naming pattern.
          [[ -n "$module_name" ]] || continue

          if [[ -z "${selected_priority[$module_name]+exists}" ]]; then
            echo "New module: $file"
            selected_file["$module_name"]="$file"
            selected_priority["$module_name"]="$priority"
            selected_count=$((selected_count + 1))
          elif (( priority < selected_priority["$module_name"] )); then
            echo "Existing module: $file ; replace with a higher-priority variant."
            selected_file["$module_name"]="$file"
            selected_priority["$module_name"]="$priority"
          fi
        done < <(find "$KERNEL_PATCHES_FOLDER/oneplus/module_overlay/modules/" -type f -name '*.ko' -print0)

        if (( selected_count == 0 )); then
          echo "No matching kernel modules found."
        fi
        
        for module_name in "${!selected_file[@]}"; do
          file="${selected_file[$module_name]}"
          priority="${selected_priority[$module_name]}"
          echo "Copying module '$module_name' priority=$priority: $file"

          dest_path=""
          if [ -d "$COMMON_KERNEL_FOLDER/kernel/module/module_overlay/modules/" ]; then
            dest_path="$COMMON_KERNEL_FOLDER/kernel/module/module_overlay/modules/${module_name}.ko"
          elif [ -d "$COMMON_KERNEL_FOLDER/kernel/module_overlay/modules/" ]; then
            dest_path="$COMMON_KERNEL_FOLDER/kernel/module_overlay/modules/${module_name}.ko"
          fi
          
          if [ -z "$dest_path" ]; then
            cp -v -- "$file" "$dest_path"
          fi
          
          if [ -z "$copied_modules" ]; then
            copied_modules="$dest_path"
          else
            copied_modules="$copied_modules:$dest_path"
          fi
        done

        ccache --set-config=extra_files_to_hash="$copied_modules"
        
        echo "✅ Other patches applied"
        echo "::endgroup::"

    - name: Apply Optimisation Patches
      if: ${{ env.OP_OPT == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply Optimisation patches"
        cd "$COMMON_KERNEL_FOLDER"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/optimized_mem_operations.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/file_struct_8bytes_align.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/reduce_cache_pressure.patch"
        
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/mem_opt_prefetch.patch"
        
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/optimise_memcmp.patch"
        elif [ "$(printf '%s\n' "$KERNEL_VERSION" "5.11" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          sed -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' "$KERNEL_PATCHES_FOLDER/common/optimise_memcmp.patch" | patch -p1 --forward
        else
          echo "Optimised memcmp patch not found!"
        fi
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/minimise_wakeup_time.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/int_sqrt.patch"
        if [ "$OP_BBR" = "false" ] && [ "$OP_BBR3" = "false" ]; then
          patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/force_tcp_nodelay.patch"
        fi
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/reduce_gc_thread_sleep_time.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/add_timeout_wakelocks_globally.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/f2fs_reduce_congestion.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/reduce_freeze_timeout.patch"
        
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/clear_page_16bytes_align.patch"
        else
          cat "$KERNEL_PATCHES_FOLDER/common/clear_page_16bytes_align.patch" | sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' | patch -p1 -F3 --forward
        fi
        
        echo "Patching add_limitation_scaling_min_freq.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/add_limitation_scaling_min_freq.patch"
        echo "Patching re_write_limitation_scaling_min_freq.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/re_write_limitation_scaling_min_freq.patch"
        echo "Patching adjust_cpu_scan_order.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/adjust_cpu_scan_order.patch"
        echo "Patching avoid_extra_s2idle_wake_attempts.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/avoid_extra_s2idle_wake_attempts.patch"
        echo "Patching disable_cache_hot_buddy.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/disable_cache_hot_buddy.patch"
        echo "Patching f2fs_enlarge_min_fsync_blocks.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/f2fs_enlarge_min_fsync_blocks.patch"
        echo "Patching increase_ext4_default_commit_age.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/increase_ext4_default_commit_age.patch"
        echo "Patching increase_sk_mem_packets.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/increase_sk_mem_packets.patch"
        echo "Patching reduce_pci_pme_wakeups.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/reduce_pci_pme_wakeups.patch"
        echo "Patching silence_irq_cpu_logspam.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/silence_irq_cpu_logspam.patch"
        echo "Patching silence_system_logspam.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/silence_system_logspam.patch"
        echo "Patching use_unlikely_wrap_cpufreq.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/use_unlikely_wrap_cpufreq.patch"
        
        echo "✅ Optimisation Patches applied"
        echo "::endgroup::"

    - name: Apply NTSync Patch
      shell: bash
      if: ${{ env.OP_NTSYNC == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply NTSync patch"
        cd "$COMMON_KERNEL_FOLDER"
        NTSYNC_FOLDER="$KERNEL_PATCHES_FOLDER/common/ntsync"
        GKI_KEY="${ANDROID_VER}-${KERNEL_VER}"
        BRANCH_SUFFIX=$(basename "$OP_BRANCH")
        
        NTSYNC_PATCH=""
        case "$OP_MODEL" in
          OP10r|OP-ACE-2-5.10.209|OP-ACE-2V-5.10.209|OP-PAD-MT6983-5.10.209|\
          OP10pro-5.10.209|OP10t-5.10.209|OP-ACE-5.10.209|OP11r-5.10.209|\
          OP-NORD-3-5.10.209|OP-ACE-RACE-5.10.209)
            if [[ "$OP_OS_VERSION" == "A15" ]]; then
              NTSYNC_PATCH="$NTSYNC_FOLDER/ntsync_compat_android12-5.10_A14.patch"
            fi
            ;;
        esac
        if [ -n "$NTSYNC_PATCH" ]; then
          if [ ! -f "$NTSYNC_PATCH" ]; then
            echo "::error::NTSync compat patch not found for ${OP_MODEL}: $(basename $NTSYNC_PATCH)"
            exit 1
          fi
        elif [ -f "$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}_${OP_OS_VERSION}.patch" ]; then
          NTSYNC_PATCH="$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}_${OP_OS_VERSION}.patch"
        elif [ -f "$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}.patch" ]; then
          NTSYNC_PATCH="$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}.patch"
        else
          echo "::error::NTSync patch not found for ${GKI_KEY} (Model: ${OP_MODEL}, Android Version: ${OP_OS_VERSION})"
          exit 1
        fi
        
        echo "Using patch: $(basename $NTSYNC_PATCH)"
        if [ "$ANDROID_VER" = "android16" ] && [ "$KERNEL_VER" = "6.12" ]; then
          echo "Removing pre-existing ntsync files for android16-6.12"
          rm -f include/uapi/linux/ntsync.h
          rm -f drivers/misc/ntsync.c
        fi
        
        echo "Patching $(basename $NTSYNC_PATCH)!"
        patch -p1 --forward < "$NTSYNC_PATCH"
        echo "Patching ntsync_base!"
        patch -p1 --forward < "$NTSYNC_FOLDER/ntsync_base.patch"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_NTSYNC=y
        EOF
        echo "✅ NTSync patch applied"
        echo "::endgroup::"

