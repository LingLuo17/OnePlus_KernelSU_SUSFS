          if ! grep -q 'EXPORT_SYMBOL.*put_ipc_ns' "$COMMON_KERNEL_FOLDER/ipc/namespace.c"; then
            echo -e '\nEXPORT_SYMBOL_GPL(put_ipc_ns);' >> "$COMMON_KERNEL_FOLDER/ipc/namespace.c"
          fi
          if ! grep -q 'EXPORT_SYMBOL.*init_ipc_ns' "$COMMON_KERNEL_FOLDER/ipc/msgutil.c"; then
            echo -e '\nEXPORT_SYMBOL_GPL(init_ipc_ns);' >> "$COMMON_KERNEL_FOLDER/ipc/msgutil.c"
          fi
        fi
        
        echo "✅ Droidspaces Support applied"
        echo "::endgroup::"

    - name: Add Re-Kernel
      if: ${{ inputs.use_rekernel }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add Re-Kernel"
        DEFCONFIG="$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
        REKERNEL_DRIVER_DIR="$COMMON_KERNEL_FOLDER/drivers/rekernel"
        TMP_REKERNEL="$RUNNER_TEMP/rekernel"
        rm -rf "$TMP_REKERNEL"

        rollback_rekernel() {
          rm -rf "$REKERNEL_DRIVER_DIR"
          sed -i '\|source "drivers/rekernel/Kconfig"|d' "$COMMON_KERNEL_FOLDER/drivers/Kconfig" 2>/dev/null || true
          sed -i '\|obj-$(CONFIG_REKERNEL) += rekernel/|d' "$COMMON_KERNEL_FOLDER/drivers/Makefile" 2>/dev/null || true
          sed -i '/^CONFIG_REKERNEL=y$/d; /^CONFIG_REKERNEL_NETWORK=y$/d' "$DEFCONFIG" 2>/dev/null || true
        }

        if ( set -euo pipefail
          echo "Integrating Re-Kernel..."
          git clone --depth 1 https://github.com/Sakion-Team/Re-Kernel.git "$TMP_REKERNEL"

          # Vendor the split upstream driver source into the kernel tree
          rm -rf "$REKERNEL_DRIVER_DIR"
          mkdir -p "$REKERNEL_DRIVER_DIR"
          cp -a "$TMP_REKERNEL/LKM-Source/." "$REKERNEL_DRIVER_DIR/"

          # Convert the upstream out-of-tree module into an in-tree built-in driver
          REKERNEL_MAKEFILE="$REKERNEL_DRIVER_DIR/Makefile"
          sed -i 's/^obj-m := rekernel\.o$/obj-$(CONFIG_REKERNEL) += rekernel.o/' "$REKERNEL_MAKEFILE"
          grep -qF 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' "$REKERNEL_MAKEFILE" || \
            echo 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' >> "$REKERNEL_MAKEFILE"
          sed -i '/^[[:space:]]*depends on MODULES[[:space:]]*$/d' "$REKERNEL_DRIVER_DIR/Kconfig"

          # Mount into the drivers tree (idempotent)
          if ! grep -qF 'source "drivers/rekernel/Kconfig"' "$COMMON_KERNEL_FOLDER/drivers/Kconfig"; then
            sed -i '/^endmenu$/i source "drivers/rekernel/Kconfig"' "$COMMON_KERNEL_FOLDER/drivers/Kconfig"
          fi
          if ! grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' "$COMMON_KERNEL_FOLDER/drivers/Makefile"; then
            echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> "$COMMON_KERNEL_FOLDER/drivers/Makefile"
          fi

          # Fix include paths for in-tree compilation
          sed -i 's|#include <../android/binder_internal.h>|#include "../android/binder_internal.h"|g' "$REKERNEL_DRIVER_DIR/rekernel_binder.c"
          # 5.10 binder_internal.h needs DEFINE_SHOW_ATTRIBUTE definitions from seq_file.h
          grep -qF '#include <linux/seq_file.h>' "$REKERNEL_DRIVER_DIR/rekernel_binder.c" || \
            sed -i '/#include <linux\/kprobes.h>/a #include <linux/seq_file.h>' "$REKERNEL_DRIVER_DIR/rekernel_binder.c"

          # Enable in defconfig (idempotent)
          grep -q '^CONFIG_REKERNEL=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"
          grep -q '^CONFIG_REKERNEL_NETWORK=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL_NETWORK=y" >> "$DEFCONFIG"
        ); then
          echo "✅ Re-Kernel driver integrated (CONFIG_REKERNEL=y, CONFIG_REKERNEL_NETWORK=y)"
          echo "::endgroup::"
          exit 0
        fi

        # Integration failed: roll back the half-applied state so leftover
        # references cannot break the kernel build
        rollback_rekernel
        echo "::error::Re-Kernel integration failed"
        exit 1

    - name: Add Build based configs
      shell: bash
      run: |
        set -euo pipefail
        echo "Add Build based configs"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=n
        CONFIG_OPTIMIZE_INLINING=y
        CONFIG_FRAME_WARN=0
        CONFIG_TRACEPOINTS=y
        EOF

    - name: Add RUST build configs
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true' }}
      run: |
        set -euo pipefail
        echo "Add Build based configs"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_ANDROID_BINDER_IPC_RUST=m
        CONFIG_RUST=y
        EOF

    - name: Save Build Metadata
      id: save_metadata
      shell: bash
      run: |
        set -euo pipefail
        echo "Save Build Metadata"
        cd "$ARTIFACTS_FOLDER"
        echo "kernel_version=${{ env.KERNEL_FULL_VER }}" >> "$GITHUB_OUTPUT"
        echo "ksu_version=${KSUVER:-unknown}" >> "$GITHUB_OUTPUT"
        echo "ksu_type=${{ inputs.ksu_type }}" >> "$GITHUB_OUTPUT"
        echo "build_timestamp=${EFFECTIVE_BUILD_TIMESTAMP:-unknown}" >> "$GITHUB_OUTPUT"
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          echo "susfs_version=${SUSVER:-unknown}" >> "$GITHUB_OUTPUT"
        fi

    - name: Customize Kernel Branding
      shell: bash
      env:
        CUSTOM_VERSION_INPUT: ${{ inputs.custom_version }}
      run: |
        set -euo pipefail
        echo "Customize Kernel Branding"
        cd "$COMMON_KERNEL_FOLDER"
        mkdir -p out
        # AnyKernel3-style: drop ALL whitespace from the input
        CUSTOM_VERSION_INPUT="$(printf '%s' "$CUSTOM_VERSION_INPUT" | tr -d '[:space:]')"
        if [ -n "$CUSTOM_VERSION_INPUT" ]; then
          if [[ "$CUSTOM_VERSION_INPUT" =~ [^A-Za-z0-9._-] ]]; then
            echo "::error::custom_version contains invalid characters. Allowed: letters, digits, ., _, -. Got: '$CUSTOM_VERSION_INPUT'"
            exit 1
          fi
          # Strip a leading "x.y.z" kernel version prefix (uname already starts with the Makefile VERSION)
          CLEAN_VERSION="$(printf '%s' "$CUSTOM_VERSION_INPUT" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')"
          if [ -z "$CLEAN_VERSION" ]; then
            echo "::error::custom_version is empty after stripping the leading kernel version prefix. Got: '$CUSTOM_VERSION_INPUT'"
            exit 1
          fi
          # Normalize to a single leading '-'
          case "$CLEAN_VERSION" in
            -*) : ;;
            *) CLEAN_VERSION="-${CLEAN_VERSION}" ;;
          esac
          # Non-fatal warning: final uname release would exceed the 64-char kernel limit
          TOTAL_LEN=$(( ${#TKERNEL_VER} + ${#CLEAN_VERSION} ))
          if [ "$TOTAL_LEN" -gt 64 ]; then
            echo "::warning::Final kernel version '${TKERNEL_VER}${CLEAN_VERSION}' is ${TOTAL_LEN} chars (>64) and may be truncated by the kernel."
          fi
          CUSTOM_LOCALVERSION="${CLEAN_VERSION}"
          echo "Custom version name: $CUSTOM_LOCALVERSION"
        else
          # Stock-format complete release:
          #   "<X.Y.Z>-android<NN>-<KMI>-g<hash>-ab<build><defconfig tail>"
          # matching the stock OnePlus uname -r layout
          #   6.6.30-android15-8-g0261dbe3cf7e-ab12786384-4k
          # The g<hash> is the pinned common-kernel source commit resolved by the
          # "Get Kernel Version Info" step. The -ab<build> number is OnePlus' CI
          # BUILD_NUMBER (workspace_status_stamp.py appends "-ab$BUILD_NUMBER"),
          # which is not part of the OSS release, so a stable 9-digit number is
          # derived from the source commit instead. The KMI tag keeps AnyKernel3's
          # boot-version check passing (it greps for "X.X.X-androidYY"), and the
          # defconfig tail (gki_defconfig CONFIG_LOCALVERSION, e.g. "-4k") stays
          # at the end like the stock string.
          if [ -n "${KERNEL_KMI_GENERATION:-}" ]; then
            CUSTOM_LOCALVERSION="-${ANDROID_VER}-${KERNEL_KMI_GENERATION}"
          else
            CUSTOM_LOCALVERSION="-${ANDROID_VER}"
            echo "::warning::KMI generation unavailable; falling back to '-${ANDROID_VER}'"
          fi
          if [ -n "${KERNEL_SRC_HASH12:-}" ]; then
            BUILD_NUMBER="$(printf '%09d' "$((0x${KERNEL_SRC_HASH12} % 1000000000))")"
            CUSTOM_LOCALVERSION="${CUSTOM_LOCALVERSION}-g${KERNEL_SRC_HASH12}-ab${BUILD_NUMBER}"
          fi
          DEFCONFIG_LV="$(sed -n 's/^CONFIG_LOCALVERSION="\([^"]*\)"$/\1/p' arch/arm64/configs/gki_defconfig || true)"
          case "$DEFCONFIG_LV" in
            ""|"${CUSTOM_LOCALVERSION}"*) : ;;
            *) CUSTOM_LOCALVERSION="${CUSTOM_LOCALVERSION}${DEFCONFIG_LV}" ;;
          esac
          echo "Custom version name: $CUSTOM_LOCALVERSION (complete stock-format release)"
        fi
        echo "CUSTOM_LOCALVERSION=$CUSTOM_LOCALVERSION" >> "$GITHUB_ENV"
        echo "KERNEL_RELEASE=${TKERNEL_VER}${CUSTOM_LOCALVERSION}" >> "$GITHUB_ENV"

    - name: Disable GPUEB
      shell: bash
      if: ${{ env.KERNEL_VER == '5.10' && (startsWith(env.OP_SOC, 'dimensity') || startsWith(env.OP_SOC, 'helio')) }}
      run: |
        set -euo pipefail
        echo "Disabling GPUEB for MTK kernel 5.10"
        sed -i '/obj-y.*gpueb/d' "$COMMON_KERNEL_FOLDER/drivers/gpu/mediatek/Makefile"

    - name: Apply Fake config.gz patch
      shell: bash
      run: |
        set -euo pipefail
        echo "Apply Fake config.gz patch"
        cd "$COMMON_KERNEL_FOLDER"
        patch -p1 < "$KERNEL_PATCHES_FOLDER/common/fake_config.patch"
        
        OPTIONS=()
        
        if [ "$OP_BBR" = "true" ] || [ "$OP_BBR3" = "true" ]; then
          OPTIONS+=("CONFIG_TCP_CONG_ADVANCED")
        fi
        
        if [ "$OP_IP_SET" = "true" ]; then
          OPTIONS+=("CONFIG_IP6_NF_NAT")
        fi
        
        CONFIG_STRING="${OPTIONS[*]}"
        echo "CONFIG_FAKE_DISABLE=${CONFIG_STRING}" >> $GITHUB_ENV
    
    - name: Disable Vendor / Kernel Modules
      shell: bash
      run: |
        set -euo pipefail
        echo "Disabling Vendor / Kernel Modules"
        cd "$COMMON_KERNEL_FOLDER"

        # Define modules that MUST NEVER be blacklisted
        RISKY_MODULES=("coresight" "rust_binder" "msm_kgsl" "camera" "oplusboot" "rmnet_wlan" "rmnet_core" "msm_drm" "cnss2" "oplus_chg_v2" "reboot_mode" "rfkill" "bootloader_log")
        
        declare -a modules=()
        IFS=',' read -ra ADDR <<< "$OP_BLACKLIST_MODULES"
        for mod in "${ADDR[@]}"; do
          [[ -n "$mod" ]] && modules+=("$mod")
        done
        
        if [ "$OP_BBR" = "true" ] || [ "$OP_BBR3" = "true" ]; then
          if [[ ! " ${modules[*]} " =~ " oplus_network_tuning " ]]; then
            modules+=("oplus_network_tuning")
          fi
          if [[ ! " ${modules[*]} " =~ " oplus_networks_tuning " ]]; then
            modules+=("oplus_networks_tuning")
          fi
        fi
        
        # Safety Validation Loop (Filter out risky modules)
        declare -a validated_modules=()
        for mod in "${modules[@]}"; do
          is_risky=false
          
          # Check if current module matches any risky module
          for risky in "${RISKY_MODULES[@]}"; do
            if [ "$mod" = "$risky" ]; then
              is_risky=true
              echo "⚠️ WARNING: Blocked attempt to blacklist protected module: $mod"
              break
            fi
          done
          
          # Only keep the module if it's safe
          if [ "$is_risky" = false ]; then
            validated_modules+=("$mod")
          fi
        done
        
        if [ ${#validated_modules[@]} -gt 0 ]; then
          RAW_JOINED=$(IFS=,; echo "${validated_modules[*]}")
          RESULT_LIST="\"${RAW_JOINED}\""
        else
          RESULT_LIST='""'
        fi

        echo "Disabling following kernel modules: ${RESULT_LIST}"
        
        echo "CONFIG_DEBLOAT_VENDOR_MODULES=${RESULT_LIST}" >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"

        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          patch -p1 < "$KERNEL_PATCHES_FOLDER/common/vendor_modules/0001-Support-conditional-vendor-modules-blacklisting-5.15-and-below.patch"
        else
          patch -p1 < "$KERNEL_PATCHES_FOLDER/common/vendor_modules/0001-Support-conditional-vendor-modules-blacklisting-6.1-and-above.patch"
        fi
        
    - name: Build Kernel
      id: build_kernel_step
      shell: bash
      env:
        PYTHONWARNINGS: "ignore:invalid escape sequence"
      run: |
        set -euo pipefail
        echo "::group::Build kernel with ccache optimization"
        
        cd "$COMMON_KERNEL_FOLDER"
        : > "$COMMON_KERNEL_FOLDER/.scmversion"
        
        export PYTHONWARNINGS="${PYTHONWARNINGS}"
        
        echo "Getting last commit timestamp from kernel source..."
        COMMIT_TIMESTAMP=$(git log -1 --format=%ct 2>/dev/null || echo "$(date +%s)")
        COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S' 2>/dev/null || date -u '+%Y-%m-%d %H:%M:%S')
        COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        
        WORKSPACE="${GITHUB_WORKSPACE}"
        MAP="-fdebug-prefix-map=${WORKSPACE}=."
        MPMAP="-fmacro-prefix-map=${WORKSPACE}=."
        FPMAP="-ffile-prefix-map=${WORKSPACE}=."
        
        export KCFLAGS="${KCFLAGS:-} $MAP $MPMAP $FPMAP -no-canonical-prefixes -fdiagnostics-color=never -Qunused-arguments -Wno-unused-command-line-argument -D__ANDROID_COMMON_KERNEL__"
        export KCPPFLAGS="${KCPPFLAGS:-} $MAP $MPMAP $FPMAP"
        
        export LLVM=1 LLVM_IAS=1
        export ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PAHOLE="$KERNEL_PLATFORM_FOLDER/prebuilts/kernel-build-tools/linux-x86/bin/pahole"
        export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm 
        export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
        
        set +u
        source "$KERNEL_PLATFORM_FOLDER/build/kernel/_setup_env.sh" 2>/dev/null || true
        set -u
        
        echo '#!/bin/bash' > "$COMMON_KERNEL_FOLDER/ld-wrapper"
        echo 'ld.lld "$@" --thinlto-jobs=$(nproc --all)' >> "$COMMON_KERNEL_FOLDER/ld-wrapper"
        chmod +x "$COMMON_KERNEL_FOLDER/ld-wrapper"
        
        export SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP
        export KBUILD_BUILD_TIMESTAMP="${EFFECTIVE_BUILD_TIMESTAMP:-$(TZ='CST-8' date +'%a %b %d %T UTC %Y')}"
        echo "📅 Kernel build timestamp: $KBUILD_BUILD_TIMESTAMP"
        echo "EFFECTIVE_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> "$GITHUB_ENV"
        export KBUILD_BUILD_USER="${BUILD_USER:-kernel}"
        export KBUILD_BUILD_HOST="${BUILD_HOST:-kleaf}"
        export KBUILD_BUILD_VERSION=1
        echo "🔢 SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH"
        echo "👤 Build user: $KBUILD_BUILD_USER"
        echo "🖥️  Build host: $KBUILD_BUILD_HOST"
        
        export CC="ccache clang"
        export CXX="ccache clang++"
        export HOSTCC="ccache clang"
        export HOSTCXX="ccache clang++"
        
        if [ "${{ inputs.clean }}" = "false" ]; then
          echo "🚀 ccache-accelerated build"
        else
          echo "🧹 Clean build mode"
        fi
        
        OUT=out
        mkdir -p "$OUT"

        echo "============================================"
        echo "🔍 Compiler & ccache Verification"
        echo "============================================"
        echo "PATH: ${PATH:0:200}..."
        echo "which clang: $(which clang)"
        echo "CC: $CC"
        echo "CXX: $CXX"
        echo "CCACHE_BASEDIR: ${CCACHE_BASEDIR:-not set}"
        echo ""
        
        echo "ccache wrapper test:"
        clang --version 2>&1 | head -n1 || true
        echo ""
        echo "ccache configuration:"
        ccache -p | grep -E "(compression|direct_mode|readonly_direct|depend|sloppiness)" || true
        echo ""
        echo "ccache pre-build status:"
        ccache -s | head -n 20
        echo "============================================"
        
        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" O="$OUT" gki_defconfig
        
        LOCAL_LOCALVERSION="${CUSTOM_LOCALVERSION:-}"
        if [ -n "$LOCAL_LOCALVERSION" ]; then
          scripts/config --file "$OUT/.config" --set-str LOCALVERSION "${LOCAL_LOCALVERSION}"
          scripts/config --file "$OUT/.config" -d LOCALVERSION_AUTO || true
          sed -i 's/scm_version="$(scm_version --short)"/scm_version=""/' scripts/setlocalversion
        fi
        
        if [ "${{ inputs.optimize_level }}" = "O3" ]; then
          scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-O3"
        else
          scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-O2"
        fi
        
        case "$OP_BRANCH" in
          wild/sm8750|wild/sm8850|wild/sm8845)
            KCFLAGS_EXTRA="-mcpu=oryon-1 ${KCFLAGS_EXTRA}"
            ;;
        esac
        
        scripts/config --file "$OUT/.config" -e LTO_CLANG -d LTO_CLANG_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL
        
        case "${{ env.OP_LTO}}" in
          "none") scripts/config --file "$OUT/.config" -e LTO_CLANG_NONE ;;
          "thin") scripts/config --file "$OUT/.config" -e LTO_CLANG_THIN ;;
          "full") scripts/config --file "$OUT/.config" -e LTO_CLANG_FULL ;;
          *)
            echo "::error::Unsupported LTO option: ${{ env.OP_LTO}}"
            exit 1
            ;;
        esac

        # ── 修复 vendor 预编译模块 Unknown symbol（全设备、全内核版本）──────────
        # 厂商分区预编译的 tls.ko / bluetooth.ko 依赖内核导出的 skmsg/sock_map 符号
        # （sk_msg_*、sk_psock_*、tcp_bpf_sendmsg_redir、sk_filter_trim_cap 等）。
        # 这些符号的导出依赖 BPF_SYSCALL + CGROUP_BPF + BPF_STREAM_PARSER
        # （select NET_SOCK_MSG / STREAM_PARSER）以及 TLS=m / BT=m 的 select 链。
        # 官方内核 .config 实测为 NET_SOCK_MSG=y + STREAM_PARSER=y。
        # 此前 BPF_STREAM_PARSER 仅在 ip_set 功能开启时追加，且 patch 链可能干扰
        # defconfig 的 select 链，导致模块加载报 Unknown symbol (err -22)。
        # 在最终 .config 层显式对齐官方配置（olddefconfig 幂等，无害）。
        scripts/config --file "$OUT/.config" \
          -e BPF_SYSCALL \
          -e CGROUP_BPF \
          -e BPF_STREAM_PARSER \
          -m TLS \
          -m BT
        echo "🔧 Aligned skmsg/sockmap symbol-export configs with stock kernel (fix tls.ko/bluetooth.ko Unknown symbol)"

        # ── 修复 oplus_nfc 链接失败（n6x 等新内核分支）────────────────────────────
        # 部分新内核分支（如 mt6835 n6x）把 CONFIG_OPLUS_NFC 的 Kconfig default 改为 y，
        # 但提供 get_project()/get_Operator_Version() 的 oplus_project 驱动
        # （CONFIG_OPLUS_FEATURE_OPROJECT）仍为 default n，导致内置 oplus_nfc 在最终
        # vmlinux 链接时报 undefined symbol。而 OPROJECT=y 编译的 mtk/ 变体仍使用已被
        # GKI 移除的 get_fs/set_fs 与 file_operations API，无法在 5.15 GKI 树上编译
        # （官方 GKI 构建中两者均为模块）。本流水线只构建 Image、不打包模块，故与
        # 同平台 n6（OPLUS_NFC 默认 n）保持一致：当 OPLUS_NFC 被启用且 OPROJECT 未启用
        # 时关闭 OPLUS_NFC（该驱动只提供 /proc 信息节点，不影响 NFC 本身功能）。
        if grep -qE '^CONFIG_OPLUS_NFC=(y|m)' "$OUT/.config" && \
           ! grep -qE '^CONFIG_OPLUS_FEATURE_OPROJECT=(y|m)' "$OUT/.config"; then
          scripts/config --file "$OUT/.config" -d OPLUS_NFC
          echo "🔧 Disabled CONFIG_OPLUS_NFC (oplus_project unavailable built-in in GKI tree; matches n6 sibling config)"
        fi

        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" O="$OUT" olddefconfig
        
        KCFLAGS="$KCFLAGS -Wno-error -pipe ${KCFLAGS_EXTRA}"
        KCPPFLAGS="$KCPPFLAGS -DCONFIG_OPTIMIZE_INLINING"
        
        echo "============================================"
        echo "🔧 Build Configuration"
        echo "============================================"
        echo "Device: ${OP_MODEL}"
        echo "Kernel: ${KERNEL_FULL_VER}"
        echo "Threads: $(nproc --all)"
        echo "Optimization: ${{ inputs.optimize_level }}"
        echo "KCFLAGS: ${KCFLAGS:0:150}..."
        echo "KCPPFLAGS: ${KCPPFLAGS:0:150}..."
        echo "Timestamp: $KBUILD_BUILD_TIMESTAMP"
        echo "Workspace: $WORKSPACE"
        
        echo "ccache: ENABLED"
        echo "  Dir: $CCACHE_DIR"
        echo "  Base: $CCACHE_BASEDIR"
        echo "  Max size: $CCACHE_MAXSIZE"
        echo "  Compression: zstd level 3"
        echo "  Features: readonly_direct, file_clone, inode_cache, depend"
        echo "============================================"

        if [ ! -d "$CCACHE_DIR" ] || [ -z "$(find "$CCACHE_DIR" -maxdepth 2 -type f -print -quit 2>/dev/null)" ]; then
          echo "🔥 Priming cache with header preprocessing..."
          make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -C "$COMMON_KERNEL_FOLDER" O="$OUT" headers_install prepare 2>&1 | head -n 20 || true
          echo ""
        fi
        
        # ---------------------------------------------------------------
        # host 工具链兼容：Ubuntu 26.04 runner 的 glibc(>=2.42) 给 strchr()/strstr()
        # 引入了 const 保留重载，strchr(const char *, int) 现在返回 const char *。
        # 6.x 内核 tools/lib/bpf/libbpf.c 中把结果赋给 char * 的语句因此触发
        #     -Werror,-Wincompatible-pointer-types-discards-qualifiers
        # 使 resolve_btfids（BTF 编译必需）失败，6.1/6.6/6.12 全系设备挂掉。
        # 对两条已知语句补显式 cast：幂等，5.10/5.15 无这些语句时自动跳过。
        LIBBPF_PATCHED=0
        while IFS= read -r LIBBPF_SRC; do
          [ -n "$LIBBPF_SRC" ] || continue
          LIBBPF_BEFORE=$(md5sum "$LIBBPF_SRC" | cut -d' ' -f1)
          sed -i -E \
            -e "s/^([[:space:]]*)next_path[[:space:]]*=[[:space:]]*strchr\(s,[[:space:]]*':'\);/\1next_path = (char *)strchr(s, ':');/" \
            -e "s/^([[:space:]]*)res[[:space:]]*=[[:space:]]*strstr\(sym_name,[[:space:]]*\"\.llvm\.\"\);/\1res = (char *)strstr(sym_name, \".llvm.\");/" \
            "$LIBBPF_SRC"
          LIBBPF_AFTER=$(md5sum "$LIBBPF_SRC" | cut -d' ' -f1)
          if [ "$LIBBPF_BEFORE" != "$LIBBPF_AFTER" ]; then
            echo "🩹 const-preserving strchr/strstr patched: ${LIBBPF_SRC#"$COMMON_KERNEL_FOLDER"/}"
            LIBBPF_PATCHED=$((LIBBPF_PATCHED + 1))
          fi
        done <<< "$(find "$COMMON_KERNEL_FOLDER" -maxdepth 6 -type f -path '*/tools/lib/bpf/libbpf.c' 2>/dev/null)"
        echo "🩹 libbpf.c host-tool patches applied: $LIBBPF_PATCHED file(s)"
        # ---------------------------------------------------------------

        BUILD_START=$(date +%s)
        set -o pipefail

        # 每次编译尝试独立落盘 compile-attempt-N.log（失败重试，上限 2 次）
        BUILD_LOG_DIR="$GITHUB_WORKSPACE/build-logs"
        mkdir -p "$BUILD_LOG_DIR"
        MAX_ATTEMPTS=2
        BUILD_ATTEMPTS=0
        BUILD_EXIT_CODE=1

        for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
          BUILD_ATTEMPTS=$ATTEMPT
          echo "========== 编译尝试 $ATTEMPT/$MAX_ATTEMPTS =========="
          if [ "${{ inputs.debug }}" == "true" ]; then
            if make V=1 LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" Image modules 2>&1 | tee build.log "$BUILD_LOG_DIR/compile-attempt-$ATTEMPT.log"; then
              BUILD_EXIT_CODE=0
            fi
          else
            if make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" Image 2>&1 | tee build.log "$BUILD_LOG_DIR/compile-attempt-$ATTEMPT.log"; then
              BUILD_EXIT_CODE=0
            fi
          fi
          [ "$BUILD_EXIT_CODE" = "0" ] && break
          echo "❌ Attempt $ATTEMPT failed"
          [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && echo "Retrying..."
        done

        echo "BUILD_ATTEMPTS=$BUILD_ATTEMPTS" >> "$GITHUB_ENV"
        echo "BUILD_EXIT_CODE=$BUILD_EXIT_CODE" >> "$GITHUB_ENV"

        if [ "$BUILD_EXIT_CODE" != "0" ]; then
          echo "::error::Kernel build failed after $BUILD_ATTEMPTS attempt(s)"
          echo "::group::Last 100 lines of build log"
          tail -n 100 "$BUILD_LOG_DIR/compile-attempt-$BUILD_ATTEMPTS.log" || true
          echo "::endgroup::"
          exit 1
        fi

        if [ "${{ inputs.debug }}" == "true" ]; then
          make V=1 LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -j"$(nproc --all)" O="$COMMON_KERNEL_FOLDER/out" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" INSTALL_MOD_PATH="$COMMON_KERNEL_FOLDER/out/install" modules_install 2>&1 | tee install.log

          cp build.log "$DEBUG_ARTIFACTS_FOLDER/build.log"
          cp install.log "$DEBUG_ARTIFACTS_FOLDER/install.log"
          rsync -av --no-links --exclude='build' "$COMMON_KERNEL_FOLDER/out/install/lib/modules"/*/ "$DEBUG_ARTIFACTS_FOLDER"
          cp "$COMMON_KERNEL_FOLDER/out/vmlinux" "$DEBUG_ARTIFACTS_FOLDER/vmlinux"
          cp "$COMMON_KERNEL_FOLDER/out/Module.symvers" "$DEBUG_ARTIFACTS_FOLDER/Module.symvers"
          cp "$COMMON_KERNEL_FOLDER/out/System.map" "$DEBUG_ARTIFACTS_FOLDER/System.map"
          
          ls -la "$DEBUG_ARTIFACTS_FOLDER"
        fi

        BUILD_END=$(date +%s)
        BUILD_TIME=$((BUILD_END - BUILD_START))
        
        echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
        
        IMG="$OUT/arch/arm64/boot/Image"
        if [ ! -f "$IMG" ]; then
          echo "::error::Kernel Image missing"
          echo "::group::Last 100 lines of build log"
          tail -n 100 build.log || echo "Build log not available"
          echo "::endgroup::"
          exit 1
        fi

        IMG_SIZE=$(stat -c%s "$IMG")
        
        echo "============================================"
        echo "✅ Build Completed Successfully"
        echo "============================================"
        echo "Duration: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
        echo "Image: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
        
        echo ""
        echo "📊 ccache Post-Build Statistics"
        echo "============================================"
        ccache -s
        echo "============================================"
        echo "::endgroup::"

    - name: 📊 ccache Post-Build Statistics
      id: ccache_stats
      if: ${{ success() && (inputs.clean == false || inputs.clean == 'false') }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::ccache final statistics"
        
        export CCACHE_DIR="${{ env.CCACHE_DIR }}"
        
        echo "Clear Temporary cache files..."
        ccache -c
        
        echo "Perform ccache eviction!"
        # 0.5 days = 12 Hrs. Delete cache unused in 12 hrs. 12 hrs is considered for safety.
        # Yes. ccache uses mtime as a store of time due to cross compatibility with different OS.
        find "$CCACHE_DIR" -type f -mtime +0.5 -delete
        # Remove empty layout subdirectories
        find "$CCACHE_DIR" -type d -empty -delete

        cp "${{ env.CCACHE_LOGFILE }}" "$CCACHE_DIR"
        
        if [ "${{ inputs.debug }}" == "true" ]; then
          if [ -f "${{ env.CCACHE_LOGFILE }}" ]; then
            echo "Rename ccache log"
            LOG_DIR=$(dirname "${{ env.CCACHE_LOGFILE }}")
            NEW_LOG_NAME="${{ env.MODEL_FLAT }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_ccache.log"
            mv "${{ env.CCACHE_LOGFILE }}" "$LOG_DIR/$NEW_LOG_NAME"
            echo "CCACHE_LOGFILE=$LOG_DIR/$NEW_LOG_NAME" >> $GITHUB_ENV
          else
            echo "⚠ ccache log not found, skipping rename."
          fi
        fi
        
        STATS="$(ccache -s)"
        
        CACHEABLE=$(echo "$STATS" | awk '/Cacheable calls:/ {
          match($0, /[0-9]+/); 
          print substr($0, RSTART, RLENGTH)
        }' | head -n1)
        
        HITS=$(echo "$STATS" | awk '/^[[:space:]]*Hits:/ {
          match($0, /[0-9]+/); 
          print substr($0, RSTART, RLENGTH)
        }' | head -n1)
        
        DIRECT=$(echo "$STATS" | awk '/Direct:/ {
          match($0, /[0-9]+/); 
          print substr($0, RSTART, RLENGTH)
        }' | head -n1)
        
        if [ "${CACHEABLE:-0}" -gt 0 ]; then
          HIT_RATE=$(awk -v h="${HITS:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (h/c)*100}')
          DIRECT_RATE=$(awk -v d="${DIRECT:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (d/c)*100}')
        else
          HIT_RATE="0.0"
          DIRECT_RATE="0.0"
        fi
        
        echo "hit_rate=${HIT_RATE}%" >> "$GITHUB_OUTPUT"
        echo "direct_rate=${DIRECT_RATE}%" >> "$GITHUB_OUTPUT"
        
        echo "::endgroup::"
        

    - name: Collect Build Stats / Validate Image
      id: collect_stats
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Collect Build stats"
        IMG="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"
        
        if [ -f "$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image" ]; then
          IMG="$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image"
        elif [ -f "$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image" ]; then
          IMG="$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image"
        fi
        
        if [ -f "$COMMON_KERNEL_FOLDER/build.log" ]; then
          WARNINGS_COUNT="$(grep -ciE '\bwarning:' "$COMMON_KERNEL_FOLDER/build.log" || true)"
          [ -n "$WARNINGS_COUNT" ] || WARNINGS_COUNT="0"
        else
          WARNINGS_COUNT="0"
        fi
        
        if [ ! -f "$IMG" ]; then
          echo "::error::Kernel Image not found at: $IMG"
          exit 1
        fi
        
        if ! file "$IMG" | grep -qi 'ARM64'; then
          echo "::error::Image is not ARM64 format"
          file "$IMG"
          exit 1
        fi
        
        IMG_SIZE=$(stat -c %s "$IMG")
        MIN_SIZE=6102400
        if [ "$IMG_SIZE" -lt "$MIN_SIZE" ]; then
          echo "::error::Image size too small: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
          exit 1
        fi
        
        IMG_SHA256=$(sha256sum "$IMG" | awk '{print $1}')
        BUILD_TIME="${BUILD_TIME:-0}"
        
        KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1)
        echo "Kernel Uname: $KERNEL_UNAME"
        echo "KERNEL_UNAME=$KERNEL_UNAME" >> "$GITHUB_ENV"
        
        printf 'warnings_count=%s\n' "$WARNINGS_COUNT" >> "$GITHUB_OUTPUT"
        printf 'image_sha256=%s\n' "$IMG_SHA256" >> "$GITHUB_OUTPUT"
        printf 'build_time=%s\n' "$BUILD_TIME" >> "$GITHUB_OUTPUT"
        
        echo "✅ Validation passed:"
        echo "   - Warnings: $WARNINGS_COUNT"
        echo "   - Image size: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
        echo "   - SHA256: $IMG_SHA256"
        echo "   - Build time: ${BUILD_TIME}s"
        echo "::endgroup::"

    - name: Create Kernel ZIP
      id: create_zip
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Create kernel ZIP package"
        
        IMAGE_PATH="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"
        
        if [ -f "$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image" ]; then
          IMAGE_PATH="$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image"
        elif [ -f "$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image" ]; then
          IMAGE_PATH="$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image"
        fi
        
        if [ ! -f "$IMAGE_PATH" ]; then
          echo "::error::Built Image not found at: $IMAGE_PATH"
          exit 1
        fi
        
        cp "$IMAGE_PATH" "$AK3_FOLDER/Image"

        cd "$AK3_FOLDER"
        
        sed -i 's/do.check_boot_version=.*/do.check_boot_version=1/' anykernel.sh
        
        case "$OP_BRANCH" in
          wild/sm8850|wild/sm8845)
            echo "Applying BBG efisp abl whitelist control patch"
            patch -p1 < "$KERNEL_PATCHES_FOLDER/common/bbg/0001-Enable-volume-input-to-enable-bbg-efisp-patch.patch"
          ;;
        esac
        
        # <ksu_variant>-<ksu_version>-<model>-<kernel_version>-<os_version>-AnyKernel3
        # The artifact name keeps the original short X.Y.Z kernel version on
        # purpose: only the kernel's own release (uname -r) carries the complete
        # stock-format string now (see KERNEL_RELEASE).
        # MODEL_FLAT carries a "-<x.y.z>" kernel sub-version tail for some devices
        # (e.g. OnePlus-Ace5-RACE-6.1.115); strip any trailing version tail so the
        # version is not printed twice next to ZIP_KERNEL_VER, even when the
        # config-stem version has drifted from what the pinned manifest actually
        # builds (the zip name then tracks the built version).
        ZIP_KERNEL_VER="${KERNEL_FULL_VER#*-}"
        if [[ "$MODEL_FLAT" =~ ^(.*)-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          ZIP_MODEL="${BASH_REMATCH[1]}"
        else
          ZIP_MODEL="$MODEL_FLAT"
        fi
        ZIP_NAME="${{ inputs.ksu_type }}-${KSUVER:-unknown}-${ZIP_MODEL}-${ZIP_KERNEL_VER}-${OP_OS_VERSION}-AnyKernel3.zip"
        mkdir -p "$ARTIFACTS_FOLDER"
        echo "kernel_release=$KERNEL_RELEASE" >> "$GITHUB_OUTPUT"
        
        echo "Creating flashable ZIP: $ZIP_NAME"
        
        if ! zip -r9 "$ZIP_NAME" ./* \
             -x "*.git*" \
             -x "$ZIP_NAME" \
             -x "README.md" 2>&1 | tee /tmp/zip.log; then
          echo "::error::Failed to create ZIP package"
          exit 1
        fi
        
        mv "$ZIP_NAME" "$ARTIFACTS_FOLDER/"
        
        find "$ARTIFACTS_FOLDER" -maxdepth 1 -type f ! -name "$ZIP_NAME" -delete
        
        ZIP_SIZE=$(stat -c%s "$ARTIFACTS_FOLDER/$ZIP_NAME")
        ZIP_SHA256=$(sha256sum "$ARTIFACTS_FOLDER/$ZIP_NAME" | awk '{print $1}')
        printf 'zip_sha256=%s\n' "$ZIP_SHA256" >> "$GITHUB_OUTPUT"
        
        echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
        echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
        
        echo ""
        echo "✅ Kernel ZIP created successfully"
        echo "   Name: $ZIP_NAME"
        echo "   Size: $(numfmt --to=iec-i --suffix=B "$ZIP_SIZE")"
        echo "   SHA256: $ZIP_SHA256"
        echo "::endgroup::"

    - name: Final Build Summary
      shell: bash
      run: |
        set -euo pipefail
        
        # Get commit SHAs with fallback
        KSU_SHA="${KSU_COMMIT_SHA:-unknown}"
        SUSFS_SHA="${SUSFS_COMMIT_SHA:-unknown}"
        
        {
          echo "Model: ${{ env.OP_MODEL }}"
          echo "OS Version: ${{ env.OP_OS_VERSION }}"
          echo "Android: ${{ env.ANDROID_VER }}"
          echo "Kernel base: ${{ env.KERNEL_VER }}"
          echo "Kernel full: ${{ env.KERNEL_FULL_VER }}"
          echo "Kernel Uname: ${{ env.KERNEL_UNAME }}"
          echo "Build User: ${{ env.BUILD_USER }}"
          echo "Build Host: ${{ env.BUILD_HOST }}"
          if [ "${{ inputs.ksu_type }}" = "BakaSU" ]; then
            echo "BakaSU Version: ${KSUVER:-unknown}"
            echo "BakaSU commit SHA: ${KSU_SHA:-unknown}"
          else
            echo "SukiSU Version: ${KSUVER:-unknown}"
            echo "SukiSU commit SHA: ${KSU_SHA:-unknown}"
          fi
          if [ "${{ env.OP_SUSFS }}" = true ]; then
            echo "SUSFS Version: ${SUSVER:-unknown}"
            echo "SUSFS commit SHA: $SUSFS_SHA"
          fi
          echo "Optimization: ${{ inputs.optimize_level }}"
          echo "Clean Build: ${{ inputs.clean }}"
          echo ""
          echo "=== OnePlus Features ==="
          echo "Kernel Optimisations: ${{ env.OP_OPT }}"
          echo "BBR: ${{ env.OP_BBR }}"
          echo "BBRv3: ${{ env.OP_BBR3 }}"
          echo "BBG: ${{ env.OP_BBG }}"
          echo "HMBIRD SCX: ${{ env.OP_HMBIRD }}"
          echo "TTL: ${{ env.OP_TTL }}"
          echo "IP_SET & IPv6 NAT: ${{ env.OP_IP_SET }}"
          echo "Unicode Fix: ${{ env.OP_UNICODE }}"
          echo "NTSync: ${{ env.OP_NTSYNC }}"
          echo "Droidspaces: ${{ env.OP_DS }}"
          echo "Re-Kernel: ${{ inputs.use_rekernel }}"
          echo ""
          echo "Image SHA256: ${{ steps.collect_stats.outputs.image_sha256 }}"
          echo "AnyKernel3 ZIP SHA256: ${{ steps.create_zip.outputs.zip_sha256 }}"
          echo "Compiler: ${CLANG_VERSION:-unknown}"
          echo "Warnings Count: ${{ steps.collect_stats.outputs.warnings_count }}"
          echo "Build Time: ${{ steps.collect_stats.outputs.build_time }}s"
          echo "编译尝试次数: ${BUILD_ATTEMPTS:-unknown}"
          echo "最终退出码: ${BUILD_EXIT_CODE:-0}"
          if [ "${{ inputs.clean }}" == "false" ]; then
            echo "ccache Hit Rate: ${{ steps.ccache_stats.outputs.hit_rate }}"
            echo "ccache Direct Rate: ${{ steps.ccache_stats.outputs.direct_rate }}"
          else
            echo "ccache: Disabled (clean build)"
          fi
          echo "Artifact Name: ${{ env.ZIP_NAME }}"
        } | tee summary.txt
        

    - name: Upload Debug Artifacts
      if: ${{ always() && !cancelled() && inputs.debug == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.DEBUG_ZIP_NAME }}
        path: ${{ env.DEBUG_ARTIFACTS_FOLDER }}
        compression-level: 9
        retention-days: 90

    - name: Upload Artifacts
      if: success() && steps.create_zip.conclusion == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ARTIFACTS_FOLDER }}/${{ env.ZIP_NAME }}
        archive: false
        compression-level: 0
        retention-days: 90

    - name: Upload ccache log
      if: success() && inputs.debug == 'true' && steps.build_kernel_step.conclusion == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: "${{ env.MODEL_FLAT }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_ccache.log"
        path: ${{ env.CCACHE_LOGFILE }}
        archive: false
        compression-level: 0
        retention-days: 90

    - name: Collect build logs
      # 无论成功失败都收集日志（成功时含 compile-attempt-N.log，失败时含报错现场），
      # 构建被更早步骤（如补丁应用）跳过时同样收集
      if: ${{ always() }}
      shell: bash
      run: |
        set -uo pipefail
        LOG_DIR="${{ github.workspace }}/build-logs"
        mkdir -p "$LOG_DIR"

        BUILD_ATTEMPTS="${BUILD_ATTEMPTS:-0}"
        BUILD_EXIT_CODE="${BUILD_EXIT_CODE:-}"

        {
          echo "Android 版本: ${{ env.ANDROID_VER }}"
          echo "内核版本: ${{ env.KERNEL_FULL_VER }}"
          echo "KernelSU 变体: ${{ inputs.ksu_type }}"
          echo "配置名称: ${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}"
          echo "Git 提交: ${{ github.sha }}"
          echo "工作流地址: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "编译尝试次数: ${BUILD_ATTEMPTS:-0}"
          echo "最终退出码: ${BUILD_EXIT_CODE:-unknown}"
          echo "KSU 提交日期: ${KSU_COMMIT_DATE:-unknown}"
          echo "SUSFS 提交日期: ${SUSFS_COMMIT_DATE:-未启用}"
          echo "编译器: ${{ env.CLANG_VERSION }}"
          echo "优化级别: ${{ inputs.optimize_level }}"
          echo "生成时间: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        } > "$LOG_DIR/summary.txt"

        # 编译尝试日志（compile-attempt-N.log，位于 build-logs/）
        for f in build.log install.log; do
          [ -f "$f" ] && cp "$f" "$LOG_DIR/" || true
        done
        for f in "${{ env.COMMON_KERNEL_FOLDER }}/out/build.log" "${{ env.COMMON_KERNEL_FOLDER }}/out/install.log"; do
          [ -f "$f" ] && cp "$f" "$LOG_DIR/" || true
        done

        df -h "${{ github.workspace }}" > "$LOG_DIR/disk-usage.txt" 2>&1 || true
        ccache -s > "$LOG_DIR/ccache-stats.txt" 2>&1 || true

        ls -la "$LOG_DIR"

    - name: Upload build logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: "${{ env.MODEL_FLAT }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_${{ inputs.ksu_type }}-Build-Logs"
        path: build-logs/
        if-no-files-found: warn
        compression-level: 9
        retention-days: 7

    - name: Collect patch rejects
      if: ${{ always() }}
      shell: bash
      run: |
        set -uo pipefail
        REJECTS_DIR="${{ github.workspace }}/patch-rejects"
        mkdir -p "$REJECTS_DIR"

        SEARCH_ROOT="${{ env.CONFIG_FOLDER }}"
        if [ -z "$SEARCH_ROOT" ] || [ ! -d "$SEARCH_ROOT" ]; then
          echo "Search root not available, skipping rejects collection."
          echo "REJ_COUNT=0" >> "$GITHUB_ENV"
          exit 0
        fi

        mapfile -t REJS < <(find "$SEARCH_ROOT" -type f -name '*.rej' 2>/dev/null || true)
        REJ_COUNT=${#REJS[@]}
        echo "Found $REJ_COUNT .rej file(s)"
        echo "REJ_COUNT=$REJ_COUNT" >> "$GITHUB_ENV"

        if [ "$REJ_COUNT" -gt 0 ]; then
          for REJ in "${REJS[@]}"; do
            REL="${REJ#"$SEARCH_ROOT"/}"
            DEST="$REJECTS_DIR/$REL"
            mkdir -p "$(dirname "$DEST")"
            cp "$REJ" "$DEST"
            ORIG="${REJ%.rej}"
            if [ -f "$ORIG" ]; then
              cp "$ORIG" "${DEST%.rej}"
            fi
            echo "$REL" >> "$REJECTS_DIR/index.txt"
          done
          echo "::warning::Found $REJ_COUNT patch reject file(s), uploaded as the Rejects artifact"
        fi

    - name: Upload patch rejects
      if: ${{ always() && env.REJ_COUNT > 0 }}
      uses: actions/upload-artifact@v7
      with:
        name: "${{ env.MODEL_FLAT }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_${{ inputs.ksu_type }}-Rejects"
        path: patch-rejects/
        if-no-files-found: ignore
        compression-level: 9
        retention-days: 7

    - name: 📥 Checkout Code
      uses: actions/checkout@v6
      if: always() && steps.build_kernel_step.conclusion == 'success'
      with:
        path: main-source
        fetch-depth: 1

    - name: Save ccache cache
      if: always() && steps.build_kernel_step.conclusion == 'success'
      continue-on-error: true
      uses: ./action-source/.github/actions/cache/save
      with:
        cache_path: ${{ env.CCACHE_DIR }}
        cache_key: ${{ inputs.ksu_type }}-v3-${{ env.MODEL_FLAT }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
        cache_bucket: "ccache-cache"
        stagger: ${{ inputs.cache_stagger }}
        debug: ${{ inputs.debug }}
        github_token: ${{ inputs.github_token }}
        working_dir: "./main-source"
        compression_level: 6
